# MindSafe CD Pipeline
# OPS-001: CI → 镜像 → Registry → 部署触发
# OPS-002: Docker 镜像版本化（Git SHA tag + semver）
# OPS-003: CI 全绿门禁 → 镜像 → 真实 SSH 部署 → 冒烟验证（P1-DEP）
name: CD

# OPS-005 修复（2026-08-07）：GitHub Actions 的 needs 不能跨 workflow 引用——原 cd.yml
# 的 build-and-push 用 needs 引用 ci.yml 的 job，导致本 workflow 校验失败
# （"depends on unknown job"），CD（含手动回滚入口）从未运行过。
# 现改用 workflow_run：CI 在 main 分支 push 完成且全部成功（conclusion == success）
# 后自动触发发布，CI 全绿门禁天然成立。
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  # P1-9 修复：CD 手动回滚入口（GitHub 页面 Run workflow → 填旧镜像 tag）
  workflow_dispatch:
    inputs:
      image_tag:
        description: '回滚目标镜像 tag（git SHA 前 7 位或 v 标签）'
        required: true
      targets:
        description: '回滚范围，逗号分隔：backend,voice,tts,frontend（默认全部）'
        default: 'backend,voice,tts,frontend'

env:
  REGISTRY: ghcr.io
  # OPS-007：Docker CLI 的 reference 解析器要求 repository 名全小写（GHCR 本身大小写不敏感，
  # 但服务器 docker compose pull 用 Docker CLI 解析，大写会报 invalid reference format）。
  # 仓库名 qianminjian/AI-Counseling-System 必须小写为 ai-counseling-system。
  IMAGE_PREFIX: qianminjian/ai-counseling-system

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    # P1-DEP：CI 四个 job 全绿（workflow_run conclusion == success）才允许发版；
    # 显式校验触发源为 main 分支的 push（排除 PR 触发的 CI 运行）
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 触发时默认 checkout default branch，必须精确到触发 commit（镜像 tag 依据）
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OPS-006：deploy/rollback 用 ${SHA:0:7} 拉取镜像，tag 必须为 7 位短 SHA
      # （type=sha 默认完整 40 位，不匹配会导致 pull 404）
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      # 后端镜像
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 前端镜像
      # AUD-035：镜像仍构建推送（保留 CD 产物一致性），但生产不消费——前端发布走 deploy-frontend
      # job 的 dist 直传；是否停止构建后续另行决策
      - name: Extract frontend metadata
        id: meta-fe
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta-fe.outputs.tags }}
          labels: ${{ steps.meta-fe.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 语音识别/情绪分析微服务镜像（与 compose 服务同名，发布链路对齐）
      - name: Extract voice-service metadata
        id: meta-voice
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/voice-service
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push voice-service
        uses: docker/build-push-action@v5
        with:
          context: backend/voice-service
          push: true
          tags: ${{ steps.meta-voice.outputs.tags }}
          labels: ${{ steps.meta-voice.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TTS 语音合成微服务镜像
      - name: Extract tts-service metadata
        id: meta-tts
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/tts-service
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push tts-service
        uses: docker/build-push-action@v5
        with:
          context: backend/tts-service
          push: true
          tags: ${{ steps.meta-tts.outputs.tags }}
          labels: ${{ steps.meta-tts.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: Deploy Notification
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()

    steps:
      - name: Notify deployment ready
        run: |
          echo "✅ Images pushed to GHCR"
          SHA=${{ github.event.workflow_run.head_sha }}
          echo "Backend: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${SHA:0:7}"
          echo "Frontend: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${SHA:0:7}（生产不消费镜像，以 dist 直传发布，见 deploy-frontend job）"
          echo "voice-service: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/voice-service:${SHA:0:7}"
          echo "tts-service: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/tts-service:${SHA:0:7}"

  # P1-DEP：真实 SSH 部署（此前仅 echo 通知，无实际发布动作）
  # 前置：服务器已首次手动部署（/guju/mindsafe/deploy 含 .env），本 job 只做镜像切换 + 拉起
  # AUD-009：deploy 与 rollback 共用 concurrency 组串行化（手动回滚与常规发布不可并发写 .env）；
  #         事件收敛到 push main，workflow_dispatch 时不再误触发布
  deploy:
    name: SSH Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success() && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    concurrency:
      group: mindsafe-deploy
      cancel-in-progress: false
    environment: production

    steps:
      # ssh-key-action 在 runner 上安装的 key 未被后续 ssh 使用（实测 Permission denied），
      # 改用手写 ssh-agent 脚本：写 id_ed25519（ssh 默认查找）+ known_hosts + ssh-add，确定性可控
      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)" >/dev/null
          ssh-add ~/.ssh/id_ed25519

      - name: Deploy via SSH
        run: |
          set -euo pipefail
          REMOTE_DIR=/guju/mindsafe
          SHA=${{ github.event.workflow_run.head_sha }}
          IMAGE_TAG=${SHA:0:7}
          # AUD-035：剔除 frontend——prod compose 无 frontend 服务（前端 dist 直传服务器，见 deploy-frontend job），
          # 此前 sed 循环死写入 FRONTEND_IMAGE 到 .env；frontend 镜像是否继续构建见 build-and-push job 注释
          IMAGES="backend voice-service tts-service"

          # 1. 在服务器 .env 中把各服务镜像指向本次构建 tag（幂等替换）
          for svc in $IMAGES; do
            VAR=$(echo "${svc^^}-IMAGE" | tr '-' '_')
            LINE="${VAR}=${REGISTRY}/${IMAGE_PREFIX}/${svc}:${IMAGE_TAG}"
            # 幂等：有行则替换、无行则追加——服务器 .env 按 .env.example 初始化时没有
            # IMAGE 系列变量行，仅 sed 替换会静默不生效，compose 回退本地 tag 导致 pull 失败
            ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "cd $REMOTE_DIR/deploy && (grep -q \"^${VAR}=\" .env && sed -i \"s|^${VAR}=.*|${LINE}|\" .env || echo \"${LINE}\" >> .env)"
          done

          # 2. AUD-003：幂等清理可能残留的 test 环境同名容器（docker-compose.test.yml 与 prod.yml
          #    共用 container_name/mindsafe-internal 网络；残留会报 container name already in use）。
          #    不触碰 postgres/redis（数据在 volume 中，up 时复用同名容器）
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker rm -f mindsafe-backend mindsafe-voice mindsafe-tts mindsafe-nginx 2>/dev/null || true"

          # 3. 拉取新镜像并滚动重启（数据库/Redis 不动）
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd $REMOTE_DIR/deploy && docker compose -f docker-compose.prod.yml pull backend voice-service tts-service nginx && docker compose -f docker-compose.prod.yml up -d --no-deps backend voice-service tts-service nginx"

      - name: Health check (backend)
        run: |
          # AUD-004：健康检查 URL 用 SMOKE_URL（域名）优先，缺省回退 https://DEPLOY_HOST；
          # 加 -k 容忍「DEPLOY_HOST=IP + 证书绑定域名」场景（内网信任域，证书校验交给浏览器层）
          HEALTH_URL="${{ secrets.SMOKE_URL }}"
          if [ -z "$HEALTH_URL" ]; then
            HEALTH_URL="https://${{ secrets.DEPLOY_HOST }}"
          fi
          for i in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$HEALTH_URL/actuator/health" || true)
            if [ "$code" = "200" ]; then echo "✅ backend healthy"; exit 0; fi
            sleep 10
          done
          echo "❌ backend health check timeout"
          exit 1

  # P0-4 修复：前端 dist 直传服务器
  # 背景：生产 nginx 直接挂载宿主机 frontend/<app>/dist 目录（docker-compose.prod.yml），
  #       frontend 镜像虽构建推送但生产从不消费——前端发布链路此前是断的。
  # 与 deploy.sh 的 rsync 模式对齐；rsync 前保留上一版 dist.prev 供回滚（P1-9）
  deploy-frontend:
    name: Rsync Frontend Dist
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success() && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    concurrency:
      group: mindsafe-deploy
      cancel-in-progress: false
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ARCH-009 E-5：模型不入仓（.gitignore），发布前必须投放；缓存加速（脚本未变更则命中）
      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: frontend/student-h5/public/models
          key: mindsafe-models-${{ hashFiles('deploy/scripts/prepare-models.sh') }}
          restore-keys: |
            mindsafe-models-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ARCH-009 E-5：端侧模型投放 + 校验和门禁（此前发布链路不投放模型，
      # checkout 后 models/ 为空 → dist 无模型 → 生产 SAME_ORIGIN 404 无拦截；
      # 现任何失败即红，阻断发布）
      - name: Prepare & verify edge models
        run: |
          bash deploy/scripts/prepare-models.sh
          bash deploy/scripts/prepare-models.sh --verify

      - name: Build student-h5
        working-directory: frontend/student-h5
        run: |
          npm ci
          npm run build

      - name: Build teacher-web
        working-directory: frontend/teacher-web
        run: |
          npm ci
          npm run build

      - name: Build parent-h5
        working-directory: frontend/parent-h5
        run: |
          npm ci
          npm run build

      # ssh-key-action 在 runner 上安装的 key 未被后续 ssh 使用（实测 Permission denied），
      # 改用手写 ssh-agent 脚本：写 id_ed25519（ssh 默认查找）+ known_hosts + ssh-add，确定性可控
      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)" >/dev/null
          ssh-add ~/.ssh/id_ed25519

      - name: Rsync dist & keep previous for rollback
        run: |
          set -euo pipefail
          REMOTE_DIR=/guju/mindsafe
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          # 1. 服务器端保留上一版 dist（回滚用）
          ssh "$HOST" "cd $REMOTE_DIR/frontend && for d in student-h5 teacher-web parent-h5; do rm -rf \$d/dist.prev && [ -d \$d/dist ] && mv \$d/dist \$d/dist.prev; done"
          # 2. rsync 新 dist（与 deploy.sh 同参数：--delete 清理旧文件）
          for app in student-h5 teacher-web parent-h5; do
            rsync -avz --delete "frontend/$app/dist/" "$HOST:$REMOTE_DIR/frontend/$app/dist/"
          done
          echo "✅ 前端 dist 已发布（上一版保留在 dist.prev）"

      - name: Health check (frontend)
        run: |
          # AUD-004：与 deploy job 同策略——SMOKE_URL 优先 + -k（IP+域名证书场景）
          HEALTH_URL="${{ secrets.SMOKE_URL }}"
          if [ -z "$HEALTH_URL" ]; then
            HEALTH_URL="https://${{ secrets.DEPLOY_HOST }}"
          fi
          for i in $(seq 1 10); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$HEALTH_URL/" || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then echo "✅ frontend reachable ($code)"; exit 0; fi
            sleep 10
          done
          echo "❌ frontend reachability check timeout"
          exit 1

  # P1-9 修复：CD 手动回滚（workflow_dispatch 指定旧镜像 tag）
  # 后端/微服务：.env 镜像指向旧 tag → pull → up
  # 前端：服务器 dist.prev → dist（由 deploy-frontend 每次发布前保留）
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    # AUD-009：与 deploy/deploy-frontend 同组串行，避免并发写 .env / dist 竞态
    concurrency:
      group: mindsafe-deploy
      cancel-in-progress: false
    environment: production

    steps:
      # ssh-key-action 在 runner 上安装的 key 未被后续 ssh 使用（实测 Permission denied），
      # 改用手写 ssh-agent 脚本：写 id_ed25519（ssh 默认查找）+ known_hosts + ssh-add，确定性可控
      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)" >/dev/null
          ssh-add ~/.ssh/id_ed25519

      - name: Rollback images & frontend
        run: |
          set -euo pipefail
          REMOTE_DIR=/guju/mindsafe
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          IMAGE_TAG="${{ inputs.image_tag }}"
          TARGETS=",${{ inputs.targets }},"

          # 1. 镜像回滚（backend / voice / tts）
          SERVICES=""
          if echo "$TARGETS" | grep -q ',backend,'; then SERVICES="$SERVICES backend"; fi
          if echo "$TARGETS" | grep -q ',voice,'; then SERVICES="$SERVICES voice-service"; fi
          if echo "$TARGETS" | grep -q ',tts,'; then SERVICES="$SERVICES tts-service"; fi
          if [ -n "$SERVICES" ]; then
            for svc in $SERVICES; do
              VAR=$(echo "${svc^^}-IMAGE" | tr '-' '_')
              LINE="${VAR}=${REGISTRY}/${IMAGE_PREFIX}/${svc}:${IMAGE_TAG}"
              # 幂等：与 deploy job 一致（有行替换、无行追加）
              ssh "$HOST" "cd $REMOTE_DIR/deploy && (grep -q \"^${VAR}=\" .env && sed -i \"s|^${VAR}=.*|${LINE}|\" .env || echo \"${LINE}\" >> .env)"
            done
            # AUD-003：幂等清理同名容器（test 残留兜底，与 deploy job 一致）
            ssh "$HOST" "docker rm -f mindsafe-backend mindsafe-voice mindsafe-tts mindsafe-nginx 2>/dev/null || true"
            ssh "$HOST" "cd $REMOTE_DIR/deploy && docker compose -f docker-compose.prod.yml pull $SERVICES && docker compose -f docker-compose.prod.yml up -d --no-deps $SERVICES"
            echo "✅ 镜像已回滚到 ${IMAGE_TAG}: ${SERVICES}"
          fi

          # 2. 前端回滚（dist.prev → dist；无 prev 则跳过）
          if echo "$TARGETS" | grep -q ',frontend,'; then
            ssh "$HOST" "cd $REMOTE_DIR/frontend && for d in student-h5 teacher-web parent-h5; do rm -rf \$d/dist && [ -d \$d/dist.prev ] && mv \$d/dist.prev \$d/dist; done"
            echo "✅ 前端已回滚到上一版 dist"
          fi

      - name: Health check after rollback
        run: |
          TARGETS=",${{ inputs.targets }},"
          if echo "$TARGETS" | grep -q ',backend,'; then
            # AUD-004：与 deploy job 同策略——SMOKE_URL 优先 + -k
            HEALTH_URL="${{ secrets.SMOKE_URL }}"
            if [ -z "$HEALTH_URL" ]; then
              HEALTH_URL="https://${{ secrets.DEPLOY_HOST }}"
            fi
            for i in $(seq 1 30); do
              code=$(curl -sk -o /dev/null -w '%{http_code}' "$HEALTH_URL/actuator/health" || true)
              if [ "$code" = "200" ]; then echo "✅ backend healthy after rollback"; exit 0; fi
              sleep 10
            done
            echo "❌ backend health check timeout after rollback"
            exit 1
          fi
          echo "✅ rollback done (no backend in scope)"

  # P1-DEP：冒烟测试接入流水线（此前 smoke-test.sh 从无流水线调用）
  smoke:
    name: E2E Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy, deploy-frontend]
    if: success() && github.event_name == 'workflow_run'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ssh-key-action 在 runner 上安装的 key 未被后续 ssh 使用（实测 Permission denied），
      # 改用手写 ssh-agent 脚本：写 id_ed25519（ssh 默认查找）+ known_hosts + ssh-add，确定性可控
      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)" >/dev/null
          ssh-add ~/.ssh/id_ed25519

      - name: Run smoke tests on server
        run: |
          set -euo pipefail
          # 上传冒烟脚本到服务器并执行（SMOKE_URL 缺省用 https://域名）
          SMOKE_URL="${{ secrets.SMOKE_URL }}"
          if [ -z "$SMOKE_URL" ]; then
            SMOKE_URL="https://${{ secrets.DEPLOY_HOST }}"
          fi
          scp tests/e2e/smoke-test.sh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/mindsafe-smoke.sh"
          # 环境变量必须在远程命令内 export，不能作为独立参数（否则变成位置参数）
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "export BASE_URL='$SMOKE_URL' TEACHER_USER='${{ secrets.TEACHER_USER }}' TEACHER_PASS='${{ secrets.TEACHER_PASS }}' ADMIN_USER='${{ secrets.ADMIN_USER }}' ADMIN_PASS='${{ secrets.ADMIN_PASS }}' && bash /tmp/mindsafe-smoke.sh"
