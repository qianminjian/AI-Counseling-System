# MindSafe Deploy - 自动部署到 Oracle Cloud
# 触发：push 到 main 分支（CI 通过后）或手动触发
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
  workflow_dispatch:
    inputs:
      skip_voice:
        description: '跳过 voice/tts 服务构建'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/mindsafe

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 后端镜像
      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64

      # 前端镜像
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64

  deploy:
    name: Deploy to Oracle Cloud
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
  
      - name: Deploy via ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/mindsafe

            # 拉取最新镜像
            docker compose -f docker-compose.test.yml pull

            # 先运行 frontend-init 复制静态文件
            docker compose -f docker-compose.test.yml run --rm frontend-init

            # 滚动更新
            docker compose -f docker-compose.test.yml up -d --remove-orphans

            # 等待健康检查
            sleep 30
            docker compose -f docker-compose.test.yml ps

            # 清理旧镜像
            docker image prune -f

            echo "✅ Deployed at $(date)"

      # 部署后自动冒烟测试（验证核心链路）
      - name: Post-deploy smoke test
        run: |
          chmod +x tests/e2e/smoke-test.sh
          BASE_URL="${{ secrets.SMOKE_URL }}" ./tests/e2e/smoke-test.sh
