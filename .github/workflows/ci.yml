# MindSafe CI Pipeline
# TEST-005: 覆盖率门禁 + 依赖扫描 + Maven 缓存
# OPS-001: 构建验证自动化
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx1024m'

jobs:
  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Maven 依赖缓存（加速重复构建）
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile
        run: mvn compile -B -q

      # verify：单测（surefire *Test）+ 集成测试（failsafe *IT，Testcontainers 用 runner 自带 Docker）
      # + jacoco report-aggregate（counseling-app，verify 阶段生成）
      # 审计 Q-01：此前只跑 mvn test，AuthFlowIT 从不执行；-Pcoverage profile 并不存在
      - name: Unit + Integration Tests (JaCoCo)
        run: mvn verify -B

      # 覆盖率门禁：行覆盖 >= 40%（真实基线 46.5%，2026-07-28；目标随 TEST-001 逐步升至 80%）
      # 审计 Q-01：报告缺失即失败，不再静默跳过（此前 jacoco-aggregate 永不生成、门禁恒走 skip 分支）
      - name: Coverage Gate Check
        run: |
          CSV=counseling-app/target/site/jacoco-aggregate/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "::error::JaCoCo aggregate report missing ($CSV) — coverage gate cannot run"
            exit 1
          fi
          MISSED=$(awk -F',' 'NR>1 {sum+=$4} END {print sum}' "$CSV")
          COVERED=$(awk -F',' 'NR>1 {sum+=$5} END {print sum}' "$CSV")
          TOTAL=$((MISSED + COVERED))
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::JaCoCo report contains no line data"
            exit 1
          fi
          PCT=$((COVERED * 100 / TOTAL))
          echo "Line coverage: ${PCT}%"
          if [ "$PCT" -lt 40 ]; then
            echo "::error::Coverage ${PCT}% below 40% gate"
            exit 1
          fi

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/counseling-app/target/site/jacoco-aggregate/
          retention-days: 7

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Trivy 漏洞扫描（轻量漏洞库 ~30MB，1-2 分钟完成，替代 OWASP dependency-check）
      # 审计 Q-03：exit-code 改 1，CRITICAL/HIGH 漏洞阻断合入（此前仅告警不阻断）
      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [student-h5, teacher-web, parent-h5]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install & Build
        run: |
          npm ci
          npm run build

      # lint/test 按需执行（parent-h5 暂无 lint，仅 student-h5 有 vitest）
      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present
