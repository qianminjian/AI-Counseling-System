# MindSafe CI Pipeline
# TEST-005: 覆盖率门禁 + 依赖扫描 + Maven 缓存
# OPS-001: 构建验证自动化
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx1024m'

jobs:
  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Maven 依赖缓存（加速重复构建）
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile
        run: mvn compile -B -q

      - name: Unit Tests + JaCoCo Coverage
        run: mvn test -B -Pcoverage

      # 覆盖率门禁：行覆盖 >= 60%（当前阶段，目标 80%）
      - name: Coverage Gate Check
        run: |
          if [ -f counseling-app/target/site/jacoco-aggregate/jacoco.csv ]; then
            MISSED=$(awk -F',' 'NR>1 {sum+=$4} END {print sum}' counseling-app/target/site/jacoco-aggregate/jacoco.csv)
            COVERED=$(awk -F',' 'NR>1 {sum+=$5} END {print sum}' counseling-app/target/site/jacoco-aggregate/jacoco.csv)
            TOTAL=$((MISSED + COVERED))
            if [ "$TOTAL" -gt 0 ]; then
              PCT=$((COVERED * 100 / TOTAL))
              echo "Line coverage: ${PCT}%"
              if [ "$PCT" -lt 60 ]; then
                echo "::error::Coverage ${PCT}% below 60% gate"
                exit 1
              fi
            fi
          else
            echo "No JaCoCo report found, skipping gate"
          fi

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/counseling-app/target/site/jacoco-aggregate/
          retention-days: 7

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Trivy 漏洞扫描（轻量漏洞库 ~30MB，1-2 分钟完成，替代 OWASP dependency-check）
      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'  # 仅告警不阻断
          ignore-unfixed: true

      - name: Upload Trivy Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [student-h5, teacher-web, parent-h5]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install & Build
        run: |
          npm ci
          npm run build
