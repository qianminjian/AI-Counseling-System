# MindSafe CI Pipeline
# TEST-005: 覆盖率门禁 + 依赖扫描 + Maven 缓存
# OPS-001: 构建验证自动化
name: CI

on:
  push:
    branches: [main, develop]
    # G2（doing/72 §9.3-1）：文档类变更不触发 CI；代码/CI 配置路径永不忽略
    paths-ignore:
      - 'design/**'
      - 'doc/**'
      - 'docs/**'
      - 'reports/**'
      - 'tmp/**'
      - 'data/**'
      - '*.md'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'design/**'
      - 'doc/**'
      - 'docs/**'
      - 'reports/**'
      - 'tmp/**'
      - 'data/**'
      - '*.md'

# AUD-052：显式收敛最小权限（contents 只读；CD 发布写权限由 cd.yml 按 job 单独授予）
permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx1024m'

jobs:
  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # GitHub Actions 原生 services（替代 Testcontainers，避免 Docker 网络不稳定）
    services:
      # G4（doing/72 §9.3-3）：探测间隔 10s→5s，容器就绪后提前被发现（收益约 5s，零风险）
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mindsafe_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d mindsafe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 通知 AbstractIntegrationTest 跳过 Testcontainers，直接用 services
      CI_DB_URL: jdbc:postgresql://localhost:5432/mindsafe_test
      CI_DB_USERNAME: test
      CI_DB_PASSWORD: test
      CI_REDIS_HOST: localhost
      CI_REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      # G1（doing/72 §9.2）：删除手动缓存步骤，仅保留 setup-java cache: maven（官方推荐，key 粒度更细，避免双缓存冗余）
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn compile -B -q

      # 初始化 PostgreSQL 扩展（Flyway 迁移前需要 uuid-ossp/pgcrypto/vector）
      - name: Init DB Extensions
        run: |
          PGPASSWORD=test psql -h localhost -U test -d mindsafe_test -c "
            CREATE EXTENSION IF NOT EXISTS vector;
            CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
          "

      # verify：单测（surefire *Test）+ 集成测试（failsafe *IT）+ jacoco report-aggregate
      # IT 使用 GitHub Actions services（非 Testcontainers）：通过 CI_DB_URL 环 境变量切换
      - name: Unit Tests + Integration Tests + JaCoCo
        run: mvn verify -B
      
      # doing/92 R-023：01_schema.sql 快照门禁（迁移后未重新生成即失败，防参照物过期）
      - name: Schema Snapshot Gate
        run: |
          PGURL=jdbc:postgresql://localhost:5432/mindsafe_test PGPASSWORD=test \
            bash backend/scripts/gen-schema-snapshot.sh backend/scripts/sql/01_schema.sql
      
      # 覆盖率门禁（P2-5：核心链路 ≥60%，整体 ≥45%）
      # 审计 Q-01：报告缺失即失败，不再静默跳过
      - name: Coverage Gate Check
        run: |
          CSV=counseling-app/target/site/jacoco-aggregate/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "::error::JaCoCo aggregate report missing ($CSV) — coverage gate cannot run"
            exit 1
          fi
          # 整体行覆盖率门禁 ≥45%（LINE_MISSED=$8, LINE_COVERED=$9）
          MISSED=$(awk -F',' 'NR>1 {sum+=$8} END {print sum+0}' "$CSV")
          COVERED=$(awk -F',' 'NR>1 {sum+=$9} END {print sum+0}' "$CSV")
          TOTAL=$((MISSED + COVERED))
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::JaCoCo report contains no line data"
            exit 1
          fi
          PCT=$((COVERED * 100 / TOTAL))
          echo "Overall line coverage: ${PCT}%"
          if [ "$PCT" -lt 45 ]; then
            echo "::error::Overall coverage ${PCT}% below 45% gate"
            exit 1
          fi
          # 核心 service 层行覆盖率 ≥60%
          CORE_MISSED=$(awk -F',' 'NR>1 && $2~/com\.mindsafe\.service/ {sum+=$8} END {print sum+0}' "$CSV")
          CORE_COVERED=$(awk -F',' 'NR>1 && $2~/com\.mindsafe\.service/ {sum+=$9} END {print sum+0}' "$CSV")
          CORE_TOTAL=$((CORE_MISSED + CORE_COVERED))
          if [ "$CORE_TOTAL" -gt 0 ]; then
            CORE_PCT=$((CORE_COVERED * 100 / CORE_TOTAL))
            echo "Core service line coverage: ${CORE_PCT}%"
            if [ "$CORE_PCT" -lt 60 ]; then
              echo "::error::Core service coverage ${CORE_PCT}% below 60% gate"
              exit 1
            fi
          else
            echo "::warning::No core service package data found in report"
          fi

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/counseling-app/target/site/jacoco-aggregate/
          retention-days: 7

  jdk25-smoke:
    # AUD-044：JDK 25 运行时冒烟（jacoco/byte-buddy/mockito 版本已覆盖，防编译/插件兼容性回归）
    # 仅编译冒烟不重复跑测试（主链路 JDK 21 已跑 verify 全量）
    name: JDK 25 Compile Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Compile smoke (JDK 25)
        run: mvn compile -B -q

  python-services-test:
    # ARCH-009 E-1：tts/voice-service pytest 入 CI（此前 Python 服务无测试门禁）
    # 失败即阻断合并（与 backend-build-test 同级门禁）
    name: Python Services Test (tts/voice)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tts-service, voice-service]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # G3（doing/72 §9.3-2）：pip wheel 缓存——key 按服务 requirements 文件 hash，两服务独立；
      # 首次 run miss+save，二次起命中，消除每次全量下载（实测 tts 8s / voice 2s）
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.service }}-${{ hashFiles(format('backend/{0}/requirements*.txt', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        # tts：requirements-lite.txt（轻量，含 fastapi/httpx/edge-tts）；
        # voice：requirements-lite.txt（OPS-003，doing/95——此前仅 pytest+pyyaml，
        # 而 test_app.py 模块级 import app 需 numpy/soundfile/fastapi，CI 静态必失败导致门禁失真）
        run: |
          if [ -f requirements-lite.txt ]; then
            pip install -r requirements-lite.txt
          else
            pip install pytest pyyaml
          fi

      - name: Run pytest
        run: python -m pytest -q

  shell-tools-test:
    # DA-05 + D-10 + DA-09 + DA-11：tests/unit/scripts 十五件套 CI 入口（2026-08-13 doing/98 D-07 注释修正：原「十四件套」数字过期，glob 实际全跑无遗漏）
    # check-commit/db-rollback-drill/gen-changelog/gen-openapi-snapshot/prepare-funasr/verify-doc-numbers/verify-config-passthrough/verify-model-names/deploy-lib + backup-common
    # 自带 temp repo/mock docker，无需额外依赖，<2min
    name: Shell Tools Test (scripts)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run scripts unit tests
        run: |
          set -euo pipefail
          for t in tests/unit/scripts/*-test.sh; do
            echo "== $t =="
            bash "$t"
          done
          echo "== tests/unit/backup-common.sh =="
          bash tests/unit/backup-common.sh

  docker-build-smoke:
    # DA-01+DA-07：Python 双服务镜像构建冒烟（此前零构建验证，COPY 漏拷 tts_engines/asr_engines 存活 3 周）
    # 只 build 不推送；构建后容器内 import 冒烟，镜像缺陷在 CI 暴露而非部署现场
    name: Docker Build Smoke (tts/voice)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tts-service, voice-service]

    steps:
      - uses: actions/checkout@v4

      # S-019（doing/93）：metrics_common/config_loader 已单源化至 backend/py-common，
      # 双份 diff 门禁随副本删除移除（单源修改即全服务生效，无分叉可能）

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: backend
          # build-push-action v6 输入名由 dockerfile 改为 file（旧名被忽略 → 误构主应用镜像）
          file: ${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: mindsafe/${{ matrix.service }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # DA-01/DA-03 验收：镜像内模块可导入（voice 有 ENTRYPOINT，需 --entrypoint 覆盖）
      # OPS-004（doing/95）：import 清单覆盖 app.py 全部直接依赖模块（含 ser_engines，
      # 此前仅 asr_engines/metrics_common，COPY 漏拷 ser_engines.py 无法拦截）
      - name: Import smoke (tts)
        if: matrix.service == 'tts-service'
        run: docker run --rm mindsafe/tts-service:smoke python -c "import tts_engines, tts_policy, metrics_common"

      - name: Import smoke (voice)
        if: matrix.service == 'voice-service'
        run: docker run --rm --entrypoint python mindsafe/voice-service:smoke -c "import asr_engines, ser_engines, config, metrics_common"

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Trivy 漏洞扫描（轻量漏洞库 ~30MB，1-2 分钟完成，替代 OWASP dependency-check）
      # 审计 Q-03：exit-code 改 1，CRITICAL/HIGH 漏洞阻断合入（此前仅告警不阻断）
      - name: Trivy Vulnerability Scan (backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true

      # 审计 P1-12：前端依赖漏洞扫描（npm lock 文件），此前 Trivy 仅扫后端
      - name: Trivy Vulnerability Scan (frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'frontend'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    # 板块12 P1-1：四端统一 CI 门禁（admin-web 加入，其 vitest 阈值 70/60/55/70 就绪，
    # 19 个测试文件直接进入门禁——板块08 P1-1/P1-2 修复项获得回归保护）
    strategy:
      matrix:
        app: [student-h5, teacher-web, parent-h5, admin-web]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install & Build
        # 审计 P2-22：构建前清理 dist，保证可复现（残留旧产物不混入新构建）
        run: |
          rm -rf dist
          npm ci
          npm run build

      # lint/test 按需执行（ARCH-009 E-5：parent-h5 已补 .oxlintrc.json，四端均接 lint；
      # 四端均有 vitest：student-h5/teacher-web/admin-web 用 vitest.config.js，parent-h5 用 vitest.config.ts（doing/73 迁移后））
      - name: Lint
        run: npm run lint --if-present

      # 审计 P1-11：覆盖率门禁强制生效——此前 CI 只跑 npm test（无 coverage），
      # vitest.config 中的 thresholds 从未被强制执行；现统一跑 test:coverage（四端均已配置阈值）
      - name: Test (with coverage gate)
        run: npm run test:coverage
