# MindSafe CI Pipeline
# TEST-005: 覆盖率门禁 + 依赖扫描 + Maven 缓存
# OPS-001: 构建验证自动化
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# AUD-052：显式收敛最小权限（contents 只读；CD 发布写权限由 cd.yml 按 job 单独授予）
permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx1024m'

jobs:
  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # GitHub Actions 原生 services（替代 Testcontainers，避免 Docker 网络不稳定）
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mindsafe_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d mindsafe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 通知 AbstractIntegrationTest 跳过 Testcontainers，直接用 services
      CI_DB_URL: jdbc:postgresql://localhost:5432/mindsafe_test
      CI_DB_USERNAME: test
      CI_DB_PASSWORD: test
      CI_REDIS_HOST: localhost
      CI_REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Maven 依赖缓存（加速重复构建）
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile
        run: mvn compile -B -q

      # 初始化 PostgreSQL 扩展（Flyway 迁移前需要 uuid-ossp/pgcrypto/vector）
      - name: Init DB Extensions
        run: |
          PGPASSWORD=test psql -h localhost -U test -d mindsafe_test -c "
            CREATE EXTENSION IF NOT EXISTS vector;
            CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
          "

      # verify：单测（surefire *Test）+ 集成测试（failsafe *IT）+ jacoco report-aggregate
      # IT 使用 GitHub Actions services（非 Testcontainers）：通过 CI_DB_URL 环境变量切换
      - name: Unit Tests + Integration Tests + JaCoCo
        run: mvn verify -B

      # 覆盖率门禁（P2-5：核心链路 ≥60%，整体 ≥45%）
      # 审计 Q-01：报告缺失即失败，不再静默跳过
      - name: Coverage Gate Check
        run: |
          CSV=counseling-app/target/site/jacoco-aggregate/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "::error::JaCoCo aggregate report missing ($CSV) — coverage gate cannot run"
            exit 1
          fi
          # 整体行覆盖率门禁 ≥45%（LINE_MISSED=$8, LINE_COVERED=$9）
          MISSED=$(awk -F',' 'NR>1 {sum+=$8} END {print sum+0}' "$CSV")
          COVERED=$(awk -F',' 'NR>1 {sum+=$9} END {print sum+0}' "$CSV")
          TOTAL=$((MISSED + COVERED))
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::JaCoCo report contains no line data"
            exit 1
          fi
          PCT=$((COVERED * 100 / TOTAL))
          echo "Overall line coverage: ${PCT}%"
          if [ "$PCT" -lt 45 ]; then
            echo "::error::Overall coverage ${PCT}% below 45% gate"
            exit 1
          fi
          # 核心 service 层行覆盖率 ≥60%
          CORE_MISSED=$(awk -F',' 'NR>1 && $2~/com\.mindsafe\.service/ {sum+=$8} END {print sum+0}' "$CSV")
          CORE_COVERED=$(awk -F',' 'NR>1 && $2~/com\.mindsafe\.service/ {sum+=$9} END {print sum+0}' "$CSV")
          CORE_TOTAL=$((CORE_MISSED + CORE_COVERED))
          if [ "$CORE_TOTAL" -gt 0 ]; then
            CORE_PCT=$((CORE_COVERED * 100 / CORE_TOTAL))
            echo "Core service line coverage: ${CORE_PCT}%"
            if [ "$CORE_PCT" -lt 60 ]; then
              echo "::error::Core service coverage ${CORE_PCT}% below 60% gate"
              exit 1
            fi
          else
            echo "::warning::No core service package data found in report"
          fi

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/counseling-app/target/site/jacoco-aggregate/
          retention-days: 7

  jdk25-smoke:
    # AUD-044：JDK 25 运行时冒烟（jacoco/byte-buddy/mockito 版本已覆盖，防编译/插件兼容性回归）
    # 仅编译冒烟不重复跑测试（主链路 JDK 21 已跑 verify 全量）
    name: JDK 25 Compile Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Compile smoke (JDK 25)
        run: mvn compile -B -q

  python-services-test:
    # ARCH-009 E-1：tts/voice-service pytest 入 CI（此前 Python 服务无测试门禁）
    # 失败即阻断合并（与 backend-build-test 同级门禁）
    name: Python Services Test (tts/voice)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tts-service, voice-service]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # tts：requirements-lite.txt（轻量，含 fastapi/httpx/edge-tts）；
        # voice：当前测试仅需 pytest+pyyaml（避免 torch 2.6 大依赖拖慢 CI，未来测试新增依赖时在此补充）
        run: |
          if [ -f requirements-lite.txt ]; then
            pip install -r requirements-lite.txt
          fi
          pip install pytest pyyaml

      - name: Run pytest
        run: python -m pytest -q

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Trivy 漏洞扫描（轻量漏洞库 ~30MB，1-2 分钟完成，替代 OWASP dependency-check）
      # 审计 Q-03：exit-code 改 1，CRITICAL/HIGH 漏洞阻断合入（此前仅告警不阻断）
      - name: Trivy Vulnerability Scan (backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true

      # 审计 P1-12：前端依赖漏洞扫描（npm lock 文件），此前 Trivy 仅扫后端
      - name: Trivy Vulnerability Scan (frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'frontend'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [student-h5, teacher-web, parent-h5]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install & Build
        # 审计 P2-22：构建前清理 dist，保证可复现（残留旧产物不混入新构建）
        run: |
          rm -rf dist
          npm ci
          npm run build

      # lint/test 按需执行（ARCH-009 E-5：parent-h5 已补 .oxlintrc.json，三端均接 lint；
      # 三端均有 vitest：student-h5/teacher-web 用 vitest.config.js，parent-h5 在 vite.config.js 内）
      - name: Lint
        run: npm run lint --if-present

      # 审计 P1-11：覆盖率门禁强制生效——此前 CI 只跑 npm test（无 coverage），
      # vitest.config 中的 thresholds 从未被强制执行；现统一跑 test:coverage（三端均已配置阈值）
      - name: Test (with coverage gate)
        run: npm run test:coverage
