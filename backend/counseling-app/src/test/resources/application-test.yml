# 集成测试配置（Testcontainers 动态覆盖数据源）
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # HikariCP 连接池：多 IT 类共享上下文时 SSE 等异步处理可能暂占连接
  datasource:
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 60000
      maximum-pool-size: 20
      leak-detection-threshold: 60000

  # Redis 由 Testcontainers 动态注入
  data:
    redis:
      timeout: 3000ms

  # Spring AI - 测试用占位（不实际调用 LLM）
  ai:
    openai:
      api-key: sk-test-placeholder
      base-url: http://localhost:19999
      chat:
        options:
          model: test-model
          temperature: 0.7
          max-tokens: 100

mybatis-plus:
  type-handlers-package: com.mindsafe.domain.handler
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.mindsafe: DEBUG
    org.testcontainers: INFO

# 集成测试中禁用定时任务（SlaEscalationScanner/DataRetentionCleanupJob）
# 避免后台调度消耗连接池、干扰 IT 类间隔离
mindsafe:
  security:
    sla-escalation:
      scan-cron: "-"
    data-retention:
      cleanup-cron: "-"
