# MindSafe AI 心理辅导系统 - 应用配置
# 本地开发环境（配合 deploy/docker-compose.yml）

server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: mindsafe-counseling

  # 文件上传限制（语音文件）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
      # COMP-009：阈值≥请求上限，音频全程内存处理不写容器临时目录（转写即删承诺，22 §6.3）
      file-size-threshold: 12MB

  # 数据源（PostgreSQL 16 + pgvector）
  datasource:
    # AUDIT-P1-14：本地端口 5433→5432，与 deploy compose / 生产保持一致（避免环境漂移）
    url: jdbc:postgresql://localhost:5432/mindsafe
    username: mindsafe
    password: ${DB_PASSWORD:mindsafe_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000

  # Flyway 数据库迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis 缓存
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

  # Spring AI - LLM 配置（供应商无关，OpenAI 兼容协议；doing/63：key 主命名 LLM_PRIMARY_*）
  ai:
    openai:
      # 主模型（供应商无关）：嵌套回退链 LLM_PRIMARY_* → LLM_* → DEEPSEEK_* → 占位
      # 避免 .env 仅设旧名（LLM_API_KEY/DEEPSEEK_API_KEY）时 api-key=空字符串触发 Assert.hasText
      api-key: ${LLM_PRIMARY_API_KEY:${LLM_API_KEY:${DEEPSEEK_API_KEY:sk-placeholder}}}
      base-url: ${LLM_PRIMARY_BASE_URL:${LLM_BASE_URL:https://api.deepseek.com}}
      chat:
        options:
          model: ${LLM_PRIMARY_MODEL:${LLM_MODEL:deepseek-v4-flash}}
          temperature: ${LLM_PRIMARY_TEMPERATURE:0.7}
          max-tokens: ${LLM_PRIMARY_MAX_TOKENS:2048}
      # Embedding 配置（RAG 向量检索 KB-101）：主对话供应商未必提供 embeddings 端点，base-url/api-key 独立配置
      # 回退链含主模型二级别名（LLM_PRIMARY_BASE_URL → LLM_BASE_URL），旧名部署（仅配 LLM_*）embedding 不破
      # 模型维度必须与 knowledge_chunks.embedding vector(1536)（V24）一致；换模型需重新摄入全部知识库
      embedding:
        base-url: ${EMBEDDING_BASE_URL:${LLM_PRIMARY_BASE_URL:${LLM_BASE_URL:https://api.deepseek.com}}}
        api-key: ${EMBEDDING_API_KEY:${LLM_PRIMARY_API_KEY:${LLM_API_KEY:sk-placeholder}}}
        options:
          model: ${EMBEDDING_MODEL:text-embedding-ada-002}

# MyBatis-Plus 配置
mybatis-plus:
  type-handlers-package: com.mindsafe.domain.handler
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Actuator 健康检查 + Prometheus 指标
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: mindsafe
    distribution:
      percentiles-histogram:
        http.server.requests: true

# 日志配置（格式与级别由 logback-spring.xml 统一管理，此处仅保留全局开关）
logging:
  level:
    com.mindsafe: INFO
    org.springframework.ai: INFO

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# MindSafe 业务配置
mindsafe:
  # LLM 性能增强配置（PERF-001 + PERF-002）
  llm:
    first-token-timeout-ms: 15000
    overall-timeout-ms: 60000
    retry-max: 1
    retry-backoff-ms: 2000
    # 备份模型（doing/63：key 备命名 LLM_BACKUP_*，旧名 LLM_FALLBACK_* 回退；enabled 由 LLM_BACKUP_API_KEY 非空派生，AiConfig 判定）
    backup:
      enabled: true
      base-url: ${LLM_BACKUP_BASE_URL:${LLM_FALLBACK_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
      api-key: ${LLM_BACKUP_API_KEY:${LLM_FALLBACK_API_KEY:}}
      model: ${LLM_BACKUP_MODEL:${LLM_FALLBACK_MODEL:qwen-plus}}
      temperature: ${LLM_BACKUP_TEMPERATURE:0.7}
      max-tokens: ${LLM_BACKUP_MAX_TOKENS:2048}
  # AI 多模型降级配置旧键别名（doing/63：外部配置可能仍引用 mindsafe.ai.fallback.*，保留兼容）
  ai:
    fallback:
      enabled: ${mindsafe.llm.backup.enabled}
      base-url: ${mindsafe.llm.backup.base-url}
      api-key: ${mindsafe.llm.backup.api-key}
      model: ${mindsafe.llm.backup.model}
      temperature: ${mindsafe.llm.backup.temperature}
      max-tokens: ${mindsafe.llm.backup.max-tokens}
  # JWT 认证（生产必须配置 secret）
  jwt:
    secret: ${MINDSAFE_JWT_SECRET:}  # 空 = 开发默认（生产 fail-fast）
    # AUDIT-P3-28：开发密钥不再硬编码于代码，此处提供默认值（仅非 prod profile 生效）
    dev-secret: ${MINDSAFE_JWT_DEV_SECRET:mindsafe-dev-secret-key-at-least-256-bits-long!!}
    # AUDIT-P1-13：签发者声明（parseToken 强制校验）
    issuer: ${MINDSAFE_JWT_ISSUER:mindsafe}
    access-expiration-ms: 7200000    # 2 小时
    refresh-expiration-ms: 604800000 # 7 天
    voice-credential-expiration-ms: 604800000  # AUD-001：声纹设备凭证 90d → 7d（与 refresh 对齐，缩小攻击窗口）
  # CORS 允许的前端域名（生产环境仅允许正式域名）
  cors:
    allowed-origins: ${MINDSAFE_CORS_ORIGINS:https://yun.gxjugu.com,http://localhost:5173,http://localhost:5174}
  # 安全策略（AUTH-014 密码策略）
  security:
    password-policy:
      min-length: 8          # 密码最小长度
      max-age-days: 90       # 密码过期天数（0 或负数 = 永不过期）
    usage-limit:
      max-daily-minutes: 30  # 学生每日对话时长上限（未保法，0 或负数 = 不限制）
    data-retention:
      normal-session-days: 180   # 普通对话保留天数（PIPL 数据最小化，对齐 design/06 §6.5 设计值 180 天）
      high-risk-session-days: 365 # 高风险对话保留天数（合规追溯）
      cleanup-cron: "0 0 3 * * ?"  # 清理任务 cron（每日凌晨 3 点）
    sla-escalation:
      enabled: true                     # 风险预警 SLA 超时兜底扫描（P-05）
      scan-cron: "0 * * * * ?"           # 扫描 cron（每分钟）
      re-alert-cooldown-minutes: 60     # 同一事件重复告警冷却期（分钟，防告警风暴；2026-08-10 30→60）
  # 输出安全（Layer1 内容过滤参数，SAFE-203 第一阶段：全局配置化；缺省回退全国心理援助热线，租户级待租户配置体系）
  safety:
    crisis-hotline: ${MINDSAFE_CRISIS_HOTLINE:400-161-9995}  # 危机热线（危机干预资源不交给 LLM，白名单演进见 SAFE-203）
  # 冷场暖场护栏（B2 收编：nudge 阈值单一配置源，Lua 原子判定唯一裁决（BA-09），预判读 Redis 真值键；改阈值只改此处）
  conversation:
    nudge:
      max-count: ${MINDSAFE_NUDGE_MAX_COUNT:2}                # 单会话连续暖场次数上限
      min-interval-seconds: ${MINDSAFE_NUDGE_MIN_INTERVAL_SECONDS:20}  # 暖场最小间隔秒
  # 声纹识别模式（local=浏览器端比对，声纹不出设备；remote=embedding传服务端比对）
  # 2026-07-28 审计裁决：默认 local（儿童生物数据最小化），remote 仅按需开启（需家长单独同意）
  voiceprint:
    mode: ${MINDSAFE_VOICEPRINT_MODE:local}  # local | remote
    verify-threshold: 0.70                    # 声纹验证阈值单一事实源（AUD-001：对齐 local 端 0.70，原 0.55 过低；system-config 按 S4-1 派生）
    max-templates: 8                          # 每用户最大模板数
  # 前端运行时配置（通过 GET /api/v1/system/config 下发，CFG-001）
  # 设计原则：此处仅放“前端需要知道”的业务参数，密钥/服务 URL 不下发
  system-config:
    voiceprint:
      # S4-1：单一事实源 = mindsafe.voiceprint.verify-threshold（0.70，AUD-001 对齐 local 端）；
      # 前端 local/remote 模式阈值统一随远程下发，消灭双源漂移（design/doing/58 S4）
      verify-threshold: ${mindsafe.voiceprint.verify-threshold}
      max-templates: 8
      enroll-segments: 3
      verify-segments: 2
    wake-word:
      model-id: "onnx-community/whisper-tiny"
      window-seconds: 2.0
      silence-rms-threshold: 0.03
    tts:
      default-persona: "xiaoxing"
      personas: xiaoxing,bobo,yueliang,xiaotaiyang,dashu,doudou,qiqiu
    guide-scripts:
      verify:
        - { prompt: "嗨！我是波波，跟我打个招呼吧！", hint: "对波波说\"你好\"就行", duration: 4 }
        - { prompt: "真棒！再跟我说一句：今天心情真好呀！", hint: "跟我说：今天心情真好呀！", duration: 4 }
      enroll:
        - { prompt: "嗨！我是波波，很高兴认识你！跟我打个招呼吧！", hint: "对波波说\"你好\"就行", duration: 4 }
        - { prompt: "真好听！再跟我说一句：我喜欢唱歌和画画！", hint: "跟我说：我喜欢唱歌和画画！", duration: 5 }
        - { prompt: "最后一句啦！跟我说：今天天气真好，我想出去玩！", hint: "跟我说：今天天气真好，我想出去玩！", duration: 5 }
  # 语音分析微服务（FunASR + emotion2vec+）
  voice-service:
    url: ${VOICE_SERVICE_URL:http://localhost:10095}
  # TTS 语音合成微服务（CosyVoice2 / edge-tts）
  tts-service:
    url: ${TTS_SERVICE_URL:http://localhost:10096}
  # 短信服务（家长手机验证）
  sms:
    # AUDIT-P0-5（2026-08-06 修订）：LoggingSmsService 不再被 @Profile(!prod) 限制，
    # prod profile 下默认仍加载 logging（不实际发短信，仅写日志），避免无 aliyun 凭证时启动失败。
    # 切换 aliyun：须在 .env 显式设置 SMS_PROVIDER=aliyun 并补齐 MINDSAFE_SMS_ALIYUN_* 4 个凭证
    # （AliyunSmsService 用 @ConditionalOnProperty(havingValue="aliyun") 接管）。
    # 正式启用短信时审计需复核：.env 同步设置 SMS_PROVIDER=aliyun。
    provider: ${MINDSAFE_SMS_PROVIDER:logging}  # logging | aliyun
    aliyun:
      access-key-id: ${MINDSAFE_SMS_ALIYUN_ACCESS_KEY_ID:}
      access-key-secret: ${MINDSAFE_SMS_ALIYUN_ACCESS_KEY_SECRET:}
      sign-name: ${MINDSAFE_SMS_ALIYUN_SIGN_NAME:}
      template-code: ${MINDSAFE_SMS_ALIYUN_TEMPLATE_CODE:}
  # 监护人同意（AUTH-040，PIPL §31）
  consent:
    # false（默认，fail-closed）：age<14 须真实监护人 SMS 闭环；仅显式配置 true 才启用试用自动授予
    trial-auto-grant: ${MINDSAFE_CONSENT_TRIAL_AUTO_GRANT:false}
  # 告警体系（OPS-004）
  alert:
    wecom:
      webhook-url: ${MINDSAFE_ALERT_WECOM_WEBHOOK_URL:}  # 空 = 降级为日志告警（BA-08：mentioned-list 零消费配置已删）
  # 字段加密（COMP-005：AES-256-GCM + ENCRYPTION_ENABLED 系统级开关，默认关闭）
  encryption:
    enabled: ${ENCRYPTION_ENABLED:false}  # 系统级开关：false=明文透传（默认，可不配密钥）；true=启动必须配置合法密钥并执行加解密
    key: ${MINDSAFE_ENCRYPTION_KEY:}  # 启用时必填：Base64 编码的 32 字节密钥
    key-version: ${MINDSAFE_ENCRYPTION_KEY_VERSION:1}  # 仅 enabled=true 时生效（V1：关闭态忽略）
    previous-keys: ${MINDSAFE_ENCRYPTION_PREVIOUS_KEYS:}  # 历史密钥，格式: version:base64key,version:base64key；仅 enabled=true 时生效
  # 设备上报签名通道（B-04，2026-08-14）：OFF=跳过（固件未就绪默认）/ LOG=有签名必验、无签名放行+WARN / ENFORCE=强制
  device:
    signature-mode: ${MINDSAFE_DEVICE_SIGNATURE_MODE:OFF}
