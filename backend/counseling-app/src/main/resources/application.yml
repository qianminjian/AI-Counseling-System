# MindSafe AI 心理辅导系统 - 应用配置
# 本地开发环境（配合 deploy/docker-compose.yml）

server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: mindsafe-counseling

  # 文件上传限制（语音文件）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
      # COMP-009：阈值≥请求上限，音频全程内存处理不写容器临时目录（转写即删承诺，22 §6.3）
      file-size-threshold: 12MB

  # 数据源（PostgreSQL 16 + pgvector）
  datasource:
    url: jdbc:postgresql://localhost:5433/mindsafe
    username: mindsafe
    password: ${DB_PASSWORD:mindsafe_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000

  # Flyway 数据库迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis 缓存
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

  # Spring AI - LLM 配置（供应商无关，OpenAI 兼容协议）
  ai:
    openai:
      api-key: ${LLM_API_KEY:sk-placeholder}
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-v4-flash}
          temperature: 0.7
          max-tokens: 2048
      # Embedding 配置（RAG 向量检索 KB-101）：主对话供应商未必提供 embeddings 端点，base-url/api-key 独立配置
      # 模型维度必须与 knowledge_chunks.embedding vector(1536)（V24）一致；换模型需重新摄入全部知识库
      embedding:
        base-url: ${EMBEDDING_BASE_URL:${LLM_BASE_URL:https://api.deepseek.com}}
        api-key: ${EMBEDDING_API_KEY:${LLM_API_KEY:sk-placeholder}}
        options:
          model: ${EMBEDDING_MODEL:text-embedding-ada-002}

# MyBatis-Plus 配置
mybatis-plus:
  type-handlers-package: com.mindsafe.domain.handler
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Actuator 健康检查 + Prometheus 指标
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: mindsafe
    distribution:
      percentiles-histogram:
        http.server.requests: true

# 日志配置（格式与级别由 logback-spring.xml 统一管理，此处仅保留全局开关）
logging:
  level:
    com.mindsafe: INFO
    org.springframework.ai: INFO

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# MindSafe 业务配置
mindsafe:
  # LLM 性能增强配置（PERF-001 + PERF-002）
  llm:
    first-token-timeout-ms: 15000
    overall-timeout-ms: 60000
    retry-max: 1
    retry-backoff-ms: 2000
  # AI 多模型降级配置（AI-004）
  ai:
    fallback:
      enabled: ${LLM_FALLBACK_ENABLED:false}
      base-url: ${LLM_FALLBACK_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${LLM_FALLBACK_API_KEY:}
      model: ${LLM_FALLBACK_MODEL:qwen-plus}
      temperature: 0.7
      max-tokens: 2048
  # JWT 认证（生产必须配置 secret）
  jwt:
    secret: ${MINDSAFE_JWT_SECRET:}  # 空 = 开发默认（生产 fail-fast）
    access-expiration-ms: 7200000    # 2 小时
    refresh-expiration-ms: 604800000 # 7 天
  # CORS 允许的前端域名（生产环境仅允许正式域名）
  cors:
    allowed-origins: ${MINDSAFE_CORS_ORIGINS:https://yun.gxjugu.com,http://localhost:5173,http://localhost:5174}
  # 安全策略（AUTH-014 密码策略）
  security:
    password-policy:
      min-length: 8          # 密码最小长度
      max-age-days: 90       # 密码过期天数（0 或负数 = 永不过期）
    usage-limit:
      max-daily-minutes: 30  # 学生每日对话时长上限（未保法，0 或负数 = 不限制）
    data-retention:
      normal-session-days: 30    # 普通对话保留天数（PIPL 数据最小化）
      high-risk-session-days: 365 # 高风险对话保留天数（合规追溯）
      cleanup-cron: "0 0 3 * * ?"  # 清理任务 cron（每日凌晨 3 点）
    sla-escalation:
      enabled: true                     # 风险预警 SLA 超时兜底扫描（P-05）
      scan-cron: "0 * * * * ?"           # 扫描 cron（每分钟）
      re-alert-cooldown-minutes: 30     # 同一事件重复告警冷却期（分钟，防告警风暴）
  # 声纹识别模式（local=浏览器端比对，remote=embedding传服务端比对）
  voiceprint:
    mode: ${MINDSAFE_VOICEPRINT_MODE:remote}  # local | remote
    verify-threshold: 0.55                    # remote 模式余弦相似度阈值（低于 local 0.70，因网络传输损耗实测 0.70 过不了）
    max-templates: 8                          # 每用户最大模板数
  # 前端运行时配置（通过 GET /api/v1/system/config 下发，CFG-001）
  # 设计原则：此处仅放“前端需要知道”的业务参数，密钥/服务 URL 不下发
  system-config:
    voiceprint:
      verify-threshold: 0.70        # 前端 local 模式余弦相似度阈值（本地 embedding 质量稳定，可用较严阈值）
      max-templates: 8
      enroll-segments: 3
      verify-segments: 2
    wake-word:
      model-id: "onnx-community/whisper-tiny"
      window-seconds: 2.0
      silence-rms-threshold: 0.03
    tts:
      default-persona: "xiaoxing"
      personas: xiaoxing,bobo,yueliang,xiaotaiyang,dashu,doudou,qiqiu
    guide-scripts:
      verify:
        - { prompt: "嗨！我是波波，跟我打个招呼吧！", hint: "对波波说\"你好\"就行", duration: 4 }
        - { prompt: "真棒！再跟我说一句：今天心情真好呀！", hint: "跟我说：今天心情真好呀！", duration: 4 }
      enroll:
        - { prompt: "嗨！我是波波，很高兴认识你！跟我打个招呼吧！", hint: "对波波说\"你好\"就行", duration: 4 }
        - { prompt: "真好听！再跟我说一句：我喜欢唱歌和画画！", hint: "跟我说：我喜欢唱歌和画画！", duration: 5 }
        - { prompt: "最后一句啦！跟我说：今天天气真好，我想出去玩！", hint: "跟我说：今天天气真好，我想出去玩！", duration: 5 }
  # 语音分析微服务（FunASR + emotion2vec+）
  voice-service:
    url: ${VOICE_SERVICE_URL:http://localhost:10095}
  # TTS 语音合成微服务（CosyVoice2 / edge-tts）
  tts-service:
    url: ${TTS_SERVICE_URL:http://localhost:10096}
  # 短信服务（家长手机验证）
  sms:
    provider: ${MINDSAFE_SMS_PROVIDER:logging}  # logging | aliyun
    aliyun:
      access-key-id: ${MINDSAFE_SMS_ALIYUN_ACCESS_KEY_ID:}
      access-key-secret: ${MINDSAFE_SMS_ALIYUN_ACCESS_KEY_SECRET:}
      sign-name: ${MINDSAFE_SMS_ALIYUN_SIGN_NAME:}
      template-code: ${MINDSAFE_SMS_ALIYUN_TEMPLATE_CODE:}
  # 监护人同意（AUTH-040，PIPL §31）
  consent:
    # true=试运行：age<14 注册时自动写入监护人同意（跳过 SMS）；生产须置 false 走 SMS 闭环
    trial-auto-grant: ${MINDSAFE_CONSENT_TRIAL_AUTO_GRANT:true}
  # 告警体系（OPS-004）
  alert:
    wecom:
      webhook-url: ${MINDSAFE_ALERT_WECOM_WEBHOOK_URL:}  # 空 = 降级为日志告警
      mentioned-list: ${MINDSAFE_ALERT_WECOM_MENTIONED:}  # @指定人手机号，逗号分隔
  # 字段加密（COMP-005：AES-256-GCM）
  encryption:
    key: ${MINDSAFE_ENCRYPTION_KEY:}  # Base64 编码的 32 字节密钥，空 = 降级为明文
    key-version: ${MINDSAFE_ENCRYPTION_KEY_VERSION:1}
    previous-keys: ${MINDSAFE_ENCRYPTION_PREVIOUS_KEYS:}  # 历史密钥，格式: version:base64key,version:base64key
