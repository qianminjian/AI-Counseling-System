# MindSafe - Production 环境配置
# 激活方式: --spring.profiles.active=prod 或 SPRING_PROFILES_ACTIVE=prod

server:
  port: 8080
  shutdown: graceful

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:mindsafe}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}

  flyway:
    enabled: true

mindsafe:
  encryption:
    key: ${MINDSAFE_ENCRYPTION_KEY}
    key-version: ${MINDSAFE_ENCRYPTION_KEY_VERSION:1}
    previous-keys: ${MINDSAFE_ENCRYPTION_PREVIOUS_KEYS:}
  llm:
    first-token-timeout-ms: 2000
    overall-timeout-ms: 45000
  alert:
    wecom:
      webhook-url: ${MINDSAFE_ALERT_WECOM_WEBHOOK_URL}
      mentioned-list: ${MINDSAFE_ALERT_WECOM_MENTIONED:}

logging:
  level:
    com.mindsafe: INFO
    org.springframework: WARN
    org.springframework.ai: WARN
  file:
    name: /var/log/mindsafe/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
