# MindSafe - Production 环境配置
# 激活方式: --spring.profiles.active=prod 或 SPRING_PROFILES_ACTIVE=prod

server:
  port: 8080
  shutdown: graceful

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:mindsafe}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  ai:
    openai:
      # 主模型（doing/63：key 主命名；回退旧名 LLM_API_KEY，均无默认值 → 未配置时 fail-fast）
      api-key: ${LLM_PRIMARY_API_KEY:${LLM_API_KEY}}
      base-url: ${LLM_PRIMARY_BASE_URL:${LLM_BASE_URL:https://api.deepseek.com}}
      # Embedding（RAG KB-101）：注意主对话供应商（如 DeepSeek）未必提供 embeddings 端点，
      # 生产应将 EMBEDDING_BASE_URL 指向支持 embeddings 的供应商；未配置时端点继承主配置，
      # 检索失败由 RagAdvisorService 失败安全降级（对话主线不受影响）。维度须匹配 vector(1536)（V24）
      embedding:
        base-url: ${EMBEDDING_BASE_URL:${LLM_PRIMARY_BASE_URL:${LLM_BASE_URL:https://api.deepseek.com}}}
        api-key: ${EMBEDDING_API_KEY:${LLM_PRIMARY_API_KEY:${LLM_API_KEY}}}
        options:
          model: ${EMBEDDING_MODEL:text-embedding-ada-002}

  flyway:
    enabled: true

# 生产环境禁用 API 文档
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

mindsafe:
  encryption:
    enabled: ${ENCRYPTION_ENABLED:false}  # 系统级开关：默认关闭（试运行期明文）；商业化发布时开启（frozen/60 COMP-008）
    key: ${MINDSAFE_ENCRYPTION_KEY}
    key-version: ${MINDSAFE_ENCRYPTION_KEY_VERSION:1}
    previous-keys: ${MINDSAFE_ENCRYPTION_PREVIOUS_KEYS:}
  llm:
    first-token-timeout-ms: 12000
    overall-timeout-ms: 45000
    retry-max: 1
    retry-backoff-ms: 2000
    # 备份模型（doing/63：key 备命名 LLM_BACKUP_*，旧名 LLM_FALLBACK_* 回退）
    backup:
      enabled: true
      base-url: ${LLM_BACKUP_BASE_URL:${LLM_FALLBACK_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
      # P2 拆分（2026-08-06）：备份 LLM 不再复用 DASHSCOPE_API_KEY（TTS/ASR 专用），
      # 改读 LLM_BACKUP_API_KEY（旧名 LLM_FALLBACK_API_KEY 回退）以满足最小权限（key 泄露面隔离 / 权限独立可吊销）
      api-key: ${LLM_BACKUP_API_KEY:${LLM_FALLBACK_API_KEY:}}
      model: ${LLM_BACKUP_MODEL:${LLM_FALLBACK_MODEL:qwen-plus}}
      temperature: ${LLM_BACKUP_TEMPERATURE:0.7}
      max-tokens: ${LLM_BACKUP_MAX_TOKENS:2048}
  # AI 多模型降级配置旧键别名（doing/63：外部配置可能仍引用 mindsafe.ai.fallback.*，保留兼容）
  ai:
    fallback:
      enabled: ${mindsafe.llm.backup.enabled}
      base-url: ${mindsafe.llm.backup.base-url}
      api-key: ${mindsafe.llm.backup.api-key}
      model: ${mindsafe.llm.backup.model}
      temperature: ${mindsafe.llm.backup.temperature}
      max-tokens: ${mindsafe.llm.backup.max-tokens}
  alert:
    wecom:
      webhook-url: ${MINDSAFE_ALERT_WECOM_WEBHOOK_URL:}
      mentioned-list: ${MINDSAFE_ALERT_WECOM_MENTIONED:}

# 容器化部署：日志走 stdout 由 Docker 收集（镜像以非 root 用户运行，/var/log 不可写）
logging:
  level:
    com.mindsafe: INFO
    org.springframework: WARN
    org.springframework.ai: WARN
