# MindSafe Prometheus 告警规则（P1-10：监控零告警规则 → 补齐）
# 挂载路径：prometheus 容器 /etc/prometheus/alert-rules.yml（见 docker-compose.monitoring.yml）
# 阈值口径：
#   - 服务不可达（critical）：学生对话/风险识别/语音链路中断，立即人工介入
#   - 5xx 错误率 > 5%（warning）：持续 5 分钟，排查依赖（LLM/DB/Redis）
#   - P95 延迟 > 2s（warning）：持续 10 分钟，排除 LLM 慢响应
#   - TTS 全引擎不可用（critical）：语音合成完全中断（浏览器 speechSynthesis 是最后兜底）
# 告警发送：Alertmanager → 企业微信应用消息（WECOM_* 配置，未配置时仅留存不推送）

groups:
  - name: mindsafe-services
    rules:
      # ----- 服务可用性（up 指标：Prometheus 抓取失败即 0） -----
      - alert: MindsafeBackendDown
        expr: up{job="mindsafe-backend"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "MindSafe 后端不可达"
          description: "后端 {{ $labels.instance }} 已离线超过 1 分钟，学生对话/风险识别/家长通知全部中断。"

      - alert: MindsafeTtsDown
        expr: up{job="tts-service"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "TTS 服务不可达"
          description: "TTS 服务 {{ $labels.instance }} 已离线超过 1 分钟，语音合成降级链（CosyVoice → edge-tts）不可用。"

      - alert: MindsafeVoiceDown
        expr: up{job="voice-service"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "语音分析服务不可达"
          description: "语音分析服务 {{ $labels.instance }} 已离线超过 1 分钟，ASR 转写与语音情感识别不可用。"

      # ----- 后端业务质量（Spring Boot Micrometer：http_server_requests_seconds） -----
      - alert: MindsafeHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (instance)
            / clamp_min(sum(rate(http_server_requests_seconds_count[5m])) by (instance), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "后端 5xx 错误率过高"
          description: "{{ $labels.instance }} 5xx 错误率 {{ $value | humanizePercentage }} 持续 5 分钟，检查 LLM/DB/Redis 依赖。"

      - alert: MindsafeHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "后端 P95 延迟超过 2s"
          description: "后端 P95 延迟 {{ $value }}s 持续 10 分钟，检查 LLM 响应与数据库慢查询。"

      # ----- TTS 引擎状态（tts-service /metrics 手写指标） -----
      - alert: MindsafeTtsAllEnginesDown
        expr: tts_engine_available == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "TTS 全部引擎不可用"
          description: "CosyVoice 与 edge-tts 均不可用，语音合成完全中断（仅剩浏览器 speechSynthesis 兜底）。"

      - alert: MindsafeTtsHighFailureRate
        expr: |
          sum(rate(tts_synthesize_requests_total{engine="error"}[5m]))
            / clamp_min(sum(rate(tts_synthesize_requests_total[5m])), 0.001) > 0.5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "TTS 失败率过高"
          description: "TTS 合成失败率 {{ $value | humanizePercentage }} 持续 5 分钟（含 503 全降级场景）。"

      # ----- 语音分析服务质量（voice-service /metrics 手写指标） -----
      - alert: MindsafeVoiceHighFailureRate
        expr: |
          sum(rate(voice_analyze_requests_total{result!="success"}[5m]))
            / clamp_min(sum(rate(voice_analyze_requests_total[5m])), 0.001) > 0.5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "语音分析失败/超时率过高"
          description: "语音分析失败率 {{ $value | humanizePercentage }} 持续 5 分钟，检查 ffmpeg/ASR/SER 链路。"

      # ----- 语音引擎就绪状态（DA-02：voice_ser_enabled 与 ready 解耦，显式禁用不告警） -----
      - alert: MindsafeVoiceAsrNotReady
        expr: voice_asr_ready == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "语音 ASR 引擎未就绪"
          description: "ASR 引擎未就绪持续 5 分钟，语音转写核心链路不可用，学生语音消息将失败。"

      - alert: MindsafeVoiceSerNotReady
        expr: voice_ser_ready == 0 and voice_ser_enabled == 1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "语音情感识别降级（SER 未就绪）"
          description: "emotion2vec+ 模型未加载，情绪识别降级为中性——功能部分失效，请检查 SER 模型加载日志。"
      
      # ----- 服务运行期降级（OPS-MON-003，BUG-TTS-01 复盘：主引擎失效但兜底可用时无告警） -----
      # 语义：服务仍可用（DEGRADED ≠ DOWN），warning 级；critical 留给全引擎不可用（既有规则）
      - alert: TtsPrimaryEngineDegraded
        expr: |
          sum(rate(tts_synthesize_requests_total{engine="edge_tts"}[5m])) > 0
            and sum(rate(tts_synthesize_requests_total{engine="cosyvoice"}[5m])) == 0
            and sum(rate(tts_synthesize_requests_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "TTS 主引擎（CosyVoice）持续降级"
          description: "近 5 分钟全部合成走 edge_tts，CosyVoice 0 成功——检查 dashscope SDK 版本/API Key/配额。"
      
      - alert: TtsDegradeRatioHigh
        expr: |
          sum(rate(tts_degraded_events_total[5m]))
            / clamp_min(sum(rate(tts_synthesize_requests_total[5m])), 0.001) > 0.3
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "TTS 降级率过高"
          description: "主引擎降级率 {{ $value | humanizePercentage }} 持续 10 分钟。"
      
      - alert: LlmPrimaryFailing
        expr: sum(rate(mindsafe_llm_model_fallback_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "LLM 主供应商连续失败"
          description: "近 10 分钟发生 {{ $value }} 次主→备切换，检查主 Key 余额/限流/服务状态。"

      # ----- 业务信号（ADMIN-P1-06，M8 业务级告警；R-11 指标仅计数无标识） -----
      - alert: MindsafeRiskOverdueHigh
        expr: mindsafe_risk_events_overdue > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "存在逾期未处置预警"
          description: "当前 {{ $value }} 起预警超过 SLA 处置时限未闭环，请检查处置队列（平台逾期清单可介入转派/强制关闭）。"

      - alert: MindsafeNotifyDeadPiling
        expr: mindsafe_risk_notify_dead >= 3
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "通知 dead 堆积"
          description: "通知失败转人工（dead）堆积 {{ $value }} 条，请核对通知通道（企微/短信）与兜底台账。"

      # ----- 业务信号（ADMIN-P1-06 补，缺口 1：单租户激增 / 认领率骤降） -----
      - alert: MindsafeRiskSurge
        expr: |
          (mindsafe_risk_events_24h > 3 * (mindsafe_risk_events_24h offset 1d) + 10)
            or (mindsafe_risk_events_24h > 20)
        for: 30m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "单租户预警激增"
          description: "租户 {{ $labels.tenant_id }} 近 24h 预警数为昨日 3 倍以上（当前 {{ $value }}），或昨日无基线但绝对量超 20 条（新租户首日兜底），请核查该租户风险来源（班级/时段/触发器）。"

      - alert: MindsafeClaimRateDrop
        expr: |
          (mindsafe_risk_events_24h > 3)
            and (mindsafe_risk_claimed_24h / clamp_min(mindsafe_risk_events_24h, 0.001)) < 0.3
            and (mindsafe_risk_claimed_24h offset 1d / clamp_min(mindsafe_risk_events_24h offset 1d, 0.001)) > 0.5
        for: 30m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "预警认领率骤降"
          description: "租户 {{ $labels.tenant_id }} 认领率由昨日 >50% 降至今日 <30%（近 24h 事件 {{ $value }} 条，守卫：>3 条才有统计意义），请关注教师响应意愿（平台可介入转派）。"
