# MindSafe Prometheus 配置
# ⚠️ 变量展开约定：${VAR} 由 Prometheus 启动时按环境变量展开（Go os.ExpandEnv，
#    不支持 :- 默认值语法）；所有默认值由 docker-compose.monitoring.yml 的
#    environment 注入（compose 支持 ${VAR:-default}），此处只写裸 ${VAR}

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# P1-10：告警规则（服务不可达 / 5xx 错误率 / P95 延迟 / TTS 全引擎不可用 / 失败率）
rule_files:
  - /etc/prometheus/alert-rules.yml

# P1-10：告警发送到 Alertmanager（compose 同网络，不公网暴露 9093）
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'mindsafe-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # OPS-P2-03（doing/96）：生产固定 targets（此前注释声称可设 PROM_TARGETS 覆盖，
      # 实为死变量 0 消费者）；本地开发需改抓取目标时直接编辑本文件。
      - targets: ['backend:8080']

  - job_name: 'tts-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['tts-service:10096']

  - job_name: 'voice-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['voice-service:10095']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
