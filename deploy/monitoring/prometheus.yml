global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'mindsafe-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # 生产环境：通过 compose internal 网络访问 backend 容器
      # 本地开发覆盖：在 docker-compose.monitoring.yml 中设置 PROM_TARGETS=host.docker.internal:8080
      - targets: ['${PROM_TARGETS:-backend:8080}']
        labels:
          env: '${PROM_ENV:-prod}'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
