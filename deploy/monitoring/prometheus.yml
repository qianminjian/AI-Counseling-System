# MindSafe Prometheus 配置
# ⚠️ 变量展开约定：${VAR} 由 Prometheus 启动时按环境变量展开（Go os.ExpandEnv，
#    不支持 :- 默认值语法）；所有默认值由 docker-compose.monitoring.yml 的
#    environment 注入（compose 支持 ${VAR:-default}），此处只写裸 ${VAR}

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# P1-10：告警规则（服务不可达 / 5xx 错误率 / P95 延迟 / TTS 全引擎不可用 / 失败率）
rule_files:
  - /etc/prometheus/alert-rules.yml

# P1-10：告警发送到 Alertmanager（compose 同网络，不公网暴露 9093）
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'mindsafe-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # 生产环境：通过 compose internal 网络访问 backend 容器
      # 本地开发覆盖：在 docker-compose.monitoring.yml 中设置 PROM_TARGETS=host.docker.internal:8080
      # 生产固定（compose env 模板不适用于 Prometheus 配置，${} 不会被展开）
      - targets: ['backend:8080']
        labels:
          env: '${PROM_ENV}'

  - job_name: 'tts-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['tts-service:10096']
        labels:
          env: '${PROM_ENV}'

  - job_name: 'voice-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['voice-service:10095']
        labels:
          env: '${PROM_ENV}'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
