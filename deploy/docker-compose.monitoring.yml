# MindSafe 监控栈（Prometheus + Grafana）
# 用法：docker compose -f docker-compose.monitoring.yml up -d
# 前提：后端已运行且 /actuator/prometheus 可访问

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: mindsafe-prometheus
    restart: unless-stopped
    # P1-DEP：不再公网暴露 9090（此前裸奔可任意访问 UI 与查询）；
    # 仅 Grafana（同网络）与 docker exec 可访问，UI 已非必要不开放
    expose:
      - "9090"
    environment:
      # 本地开发：在 .env 中设 PROM_TARGETS=host.docker.internal:8080
      - PROM_TARGETS=${PROM_TARGETS:-backend:8080}
      - PROM_ENV=${PROM_ENV:-prod}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      # P1-DEP：移除 --web.enable-admin-api（admin API 可删/改 TSDB 数据，公网暴露风险高）
    networks:
      - monitoring
      - internal

  grafana:
    image: grafana/grafana:latest
    container_name: mindsafe-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # P1-DEP：强制必填（:? 语法缺省 fail-fast），禁止弱默认密码 mindsafe
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD 必须设置（强密码，见 .env.example）}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  promdata:
  grafanadata:

networks:
  monitoring:
    driver: bridge
  internal:
    name: mindsafe-internal
    external: true
