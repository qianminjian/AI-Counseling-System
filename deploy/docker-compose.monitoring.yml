# 用法：docker compose -f docker-compose.monitoring.yml up -d
# 前提：后端已运行且 /actuator/prometheus 可访问；tts/voice 服务已运行且 /metrics 可访问

services:
  prometheus:
    # AUD-029：镜像固定版本（此前 :latest 漂移导致升级不可控）
    image: prom/prometheus:v2.53.1
    container_name: mindsafe-prometheus
    restart: unless-stopped
    # P1-DEP：不再公网暴露 9090（此前裸奔可任意访问 UI 与查询）；
    # 仅 Grafana（同网络）与 docker exec 可访问，UI 已非必要不开放
    expose:
      - "9090"
    # OPS-P2-03（doing/96）：PROM_TARGETS 等四变量 + PROM_ENV 全删（prometheus.yml
    # 不展开环境变量、targets 固定硬编码，均为 0 消费者死变量）；本地开发需改抓取目标
    # 时直接编辑 prometheus.yml。environment 块已随变量一并移除。
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # P1-10：告警规则挂载（prometheus.yml rule_files 引用）
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      # P1-DEP：移除 --web.enable-admin-api（admin API 可删/改 TSDB 数据，公网暴露风险高）
    networks:
      - monitoring
      - internal

  # P1-10：告警接收与推送（企业微信应用消息）
  # 未配置 WECOM_* 时注入哨兵值 → 运行时推送失败仅留日志，不阻塞监控栈启动
  alertmanager:
    # AUD-029：镜像固定版本
    image: prom/alertmanager:v0.27.0
    container_name: mindsafe-alertmanager
    restart: unless-stopped
    # 不公网暴露 9093（与 Prometheus 同策略：仅 internal 网络可达）
    expose:
      - "9093"
    environment:
      # Alertmanager 配置文件中的 ${VAR} 由容器环境变量展开（未定义 → 空串导致校验失败，
      # 故此处全部注入非空哨兵默认值，缺配置时运行时报错可见、服务不崩）
      - WECOM_CORP_ID=${WECOM_CORP_ID:-not-configured}
      - WECOM_AGENT_ID=${WECOM_AGENT_ID:-0}
      - WECOM_SECRET=${WECOM_SECRET:-not-configured}
      - WECOM_ALERT_TO_USER=${WECOM_ALERT_TO_USER:-@all}
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertdata:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring
      - internal

  grafana:
    # AUD-029：镜像固定版本
    image: grafana/grafana:11.2.2
    container_name: mindsafe-grafana
    restart: unless-stopped
    # AUD-031：不再公网暴露 3002（HTTP 明文 + 仅密码保护不满足等保二级传输加密）——
    # 仅绑定 127.0.0.1，运维访问用 ssh 隧道：ssh -L 3002:127.0.0.1:3002 user@host 后浏览器开 http://localhost:3002
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # P1-DEP：强制必填（:? 语法缺省 fail-fast），禁止弱默认密码 mindsafe
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD 必须设置（强密码，见 .env.example）}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  promdata:
  alertdata:
  grafanadata:

networks:
  monitoring:
    driver: bridge
  internal:
    name: mindsafe-internal
    # OPS-P3-13（doing/96）：external 依赖 prod 栈先启动（compose 无法表达跨栈依赖）；
    # 先 docker compose -f docker-compose.prod.yml up -d 再启动监控栈，否则网络接入失败。
    external: true
