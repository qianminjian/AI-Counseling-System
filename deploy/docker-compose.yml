# MindSafe 全栈部署（一键启动）
# 用法：docker compose up -d --build
# 访问：http://localhost（学生端）/ http://localhost/teacher（教师端）/ http://localhost/bigscreen（大屏）

services:
  # ===== PostgreSQL（pgvector 镜像：Flyway V24 需要 vector 扩展；与 prod 对齐） =====
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mindsafe
      POSTGRES_USER: mindsafe
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mindsafe2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化：pgvector/uuid-ossp/pgcrypto 扩展（与 prod 一致）
      - ./init/pg-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindsafe"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ===== Redis（会话状态/限流/token黑名单/验证码均依赖，与 prod 对齐） =====
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ===== TTS 语音合成微服务（CosyVoice + edge-tts 降级） =====
  tts-service:
    build:
      context: ../backend/tts-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # TTS 模型名（CFG-004：运行时切换模型无需改代码，默认 cosyvoice-v3-flash）
      DASHSCOPE_TTS_MODEL: ${DASHSCOPE_TTS_MODEL:-cosyvoice-v3-flash}
      # DC-003：TTS 运行时参数透传（与 .env.example 声明、tts-service 消费对齐）
      TTS_SYNTHESIZE_TIMEOUT: ${TTS_SYNTHESIZE_TIMEOUT:-30}
      TTS_CORS_ORIGINS: ${TTS_CORS_ORIGINS:-}

  # ===== 语音识别与情绪分析微服务（ASR + SER 解耦） =====
  voice-service:
    build:
      context: ../backend/voice-service
      dockerfile: Dockerfile
      args:
        ASR_ENGINE: ${ASR_ENGINE:-dashscope}
    environment:
      # ASR 引擎：funasr=本地 / dashscope=云端
      ASR_ENGINE: ${ASR_ENGINE:-dashscope}
      # SER 情感分析：true=加载本地 emotion2vec+ / false=禁用（降级中性）
      SER_ENABLED: ${SER_ENABLED:-true}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    volumes:
      # 模型缓存：宿主机持久化（emotion2vec ~300MB + SenseVoice ~1GB）
      # 使用前需运行: bash deploy/scripts/prepare-funasr.sh
      # 容器内挂载到非 root 用户 HOME（审计 P3-31：容器不再以 root 运行）
      - ${MODEL_CACHE_DIR:-./cache/modelscope}:/home/appuser/.cache/modelscope
    restart: unless-stopped

  # ===== Spring Boot 后端 =====
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mindsafe
      SPRING_DATASOURCE_USERNAME: mindsafe
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mindsafe2026}
      SPRING_DATA_REDIS_HOST: redis
      # 变量名必须与 application.yml 占位符 ${LLM_PRIMARY_*} 一致（doing/63：key 主命名，旧名 LLM_* 由 compose 层迁移）；
      # 写成 SPRING_AI_DEEPSEEK_* 时 Spring 不会绑定，LLM 调用将用 sk-placeholder 失败
      LLM_PRIMARY_API_KEY: ${LLM_PRIMARY_API_KEY:-${LLM_API_KEY:-sk-placeholder}}
      LLM_PRIMARY_BASE_URL: ${LLM_PRIMARY_BASE_URL:-${LLM_BASE_URL:-https://api.deepseek.com}}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-${LLM_MODEL:-deepseek-v4-flash}}
      LLM_PRIMARY_TEMPERATURE: ${LLM_PRIMARY_TEMPERATURE:-0.7}
      LLM_PRIMARY_MAX_TOKENS: ${LLM_PRIMARY_MAX_TOKENS:-2048}
      # LLM 备份模型（可选：为空 = 单模型模式）
      LLM_BACKUP_API_KEY: ${LLM_BACKUP_API_KEY:-${LLM_FALLBACK_API_KEY:-}}
      LLM_BACKUP_BASE_URL: ${LLM_BACKUP_BASE_URL:-${LLM_FALLBACK_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}}
      LLM_BACKUP_MODEL: ${LLM_BACKUP_MODEL:-${LLM_FALLBACK_MODEL:-qwen-plus}}
      # application.yml 读取 ${MINDSAFE_JWT_SECRET}，裸 JWT_SECRET 不会被使用
      MINDSAFE_JWT_SECRET: ${JWT_SECRET:-mindsafe-jwt-secret-change-in-production}
      # 变量名必须与 application.yml 占位符 ${TTS_SERVICE_URL} 一致；
      # 写成 MINDSAFE_TTS_SERVICE_URL 时 Spring 松散绑定匹配不上，会回落 localhost
      TTS_SERVICE_URL: http://tts-service:10096
      VOICE_SERVICE_URL: http://voice-service:10095
      # 企业微信 OAuth（可选，空 = 企微登录返回 501）
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      WECOM_SECRET: ${WECOM_SECRET:-}
      WECOM_REDIRECT_URI: ${WECOM_REDIRECT_URI:-}
      # 监护人同意：默认 false（fail-closed，PIPL §31），显式置 true 仅用于内部试用环境
      MINDSAFE_CONSENT_TRIAL_AUTO_GRANT: ${MINDSAFE_CONSENT_TRIAL_AUTO_GRANT:-false}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tts-service:
        condition: service_started
    ports:
      # 仅本机可访问（P0-3）：公网唯一入口为 nginx（80/443），避免绕过 nginx 直连后端伪造 XFF 头
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # ===== 前端构建（静态资源） =====
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_assets:/app

  # ===== Nginx 反向代理 =====
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 公共安全头（P1-DEP：default.conf include 引用，必须挂载到 /etc/nginx/ 下）
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - frontend_assets:/app:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  frontend_assets:
