# MindSafe 全栈部署（一键启动）
# 用法：docker compose up -d --build
# 访问：http://localhost（学生端）/ http://localhost/teacher（教师端）/ http://localhost/bigscreen（大屏）

services:
  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mindsafe
      POSTGRES_USER: mindsafe
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mindsafe2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindsafe"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ===== TTS 语音合成微服务（edge-tts） =====
  tts-service:
    build:
      context: ../backend/tts-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}

  # ===== 语音识别与情绪分析微服务（FunASR / DashScope 双引擎） =====
  voice-service:
    build:
      context: ../backend/voice-service
      dockerfile: Dockerfile
      args:
        ASR_ENGINE: ${ASR_ENGINE:-dashscope}
    environment:
      # ASR 引擎选择：funasr=本地自部署（需 6GB 内存）/ dashscope=阿里云云端（<512MB）
      ASR_ENGINE: ${ASR_ENGINE:-dashscope}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    volumes:
      # FunASR 模型缓存：宿主机持久化，避免每次重建容器重新下载 3GB+ 模型
      # 使用前需运行: bash deploy/scripts/prepare-funasr.sh
      - ${MODEL_CACHE_DIR:-./cache/modelscope}:/root/.cache/modelscope
    restart: unless-stopped

  # ===== Spring Boot 后端 =====
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mindsafe
      SPRING_DATASOURCE_USERNAME: mindsafe
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mindsafe2026}
      SPRING_AI_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-sk-placeholder}
      SPRING_AI_DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      JWT_SECRET: ${JWT_SECRET:-mindsafe-jwt-secret-change-in-production}
      # 变量名必须与 application.yml 占位符 ${TTS_SERVICE_URL} 一致；
      # 写成 MINDSAFE_TTS_SERVICE_URL 时 Spring 松散绑定匹配不上，会回落 localhost
      TTS_SERVICE_URL: http://tts-service:10096
      VOICE_SERVICE_URL: http://voice-service:10095
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
    depends_on:
      postgres:
        condition: service_healthy
      tts-service:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ===== 前端构建（静态资源） =====
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_assets:/app

  # ===== Nginx 反向代理 =====
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_assets:/app:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  frontend_assets:
