# MindSafe 本地开发环境
# 用法：docker compose up -d
# 端口约定：PG 5433 / Redis 6379 / 后端 8080 / 学生端 3000 / 教师端 3001 / 语音分析 10095 / TTS 10096

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindsafe-pg
    environment:
      POSTGRES_DB: mindsafe
      POSTGRES_USER: mindsafe
      POSTGRES_PASSWORD: mindsafe_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/pg-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindsafe"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mindsafe-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  voice-service:
    build:
      context: ../backend/voice-service
      dockerfile: Dockerfile
    container_name: mindsafe-voice
    ports:
      - "10095:10095"
    # 模型已在镜像构建期烘焙到 /root/.cache/modelscope，无需外挂 volume（外挂空卷会遮蔽缓存导致运行时重新下载）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10095/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 6G

  tts-service:
    build:
      context: ../backend/tts-service
      dockerfile: Dockerfile
    container_name: mindsafe-tts
    ports:
      - "10096:10096"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10096/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  pgdata:
