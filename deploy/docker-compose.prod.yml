# MindSafe 生产部署
# 用法：cp .env.example .env && 编辑 .env && docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindsafe-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindsafe
      POSTGRES_USER: mindsafe
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/pg-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindsafe"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: mindsafe-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mindsafe-backend
    restart: unless-stopped
    environment:
      # 激活 prod profile：启用 fail-fast 守卫（JWT/加密密钥缺失拒绝启动）、禁用 Swagger
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mindsafe
      SPRING_DATASOURCE_USERNAME: mindsafe
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      MINDSAFE_JWT_SECRET: ${JWT_SECRET}
      MINDSAFE_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MINDSAFE_ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
      MINDSAFE_ENCRYPTION_PREVIOUS_KEYS: ${ENCRYPTION_PREVIOUS_KEYS:-}
      MINDSAFE_ALERT_WECOM_WEBHOOK_URL: ${ALERT_WECOM_WEBHOOK_URL:-}
      MINDSAFE_ALERT_WECOM_MENTIONED: ${ALERT_WECOM_MENTIONED:-}
      MINDSAFE_SMS_PROVIDER: ${SMS_PROVIDER:-logging}
      MINDSAFE_SMS_ALIYUN_ACCESS_KEY_ID: ${SMS_ALIYUN_ACCESS_KEY_ID:-}
      MINDSAFE_SMS_ALIYUN_ACCESS_KEY_SECRET: ${SMS_ALIYUN_ACCESS_KEY_SECRET:-}
      MINDSAFE_SMS_ALIYUN_SIGN_NAME: ${SMS_ALIYUN_SIGN_NAME:-}
      MINDSAFE_SMS_ALIYUN_TEMPLATE_CODE: ${SMS_ALIYUN_TEMPLATE_CODE:-}
      MINDSAFE_CORS_ORIGINS: ${CORS_ORIGINS:-https://yun.gxjugu.com}
      VOICE_SERVICE_URL: http://voice-service:10095
      TTS_SERVICE_URL: http://tts-service:10096
      LOGGING_LEVEL_COM_MINDSAFE: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - internal

  voice-service:
    build:
      context: ../backend/voice-service
      dockerfile: Dockerfile
    container_name: mindsafe-voice
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10095/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 6G
    networks:
      - internal

  tts-service:
    build:
      context: ../backend/tts-service
      dockerfile: Dockerfile
    container_name: mindsafe-tts
    restart: unless-stopped
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10096/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: mindsafe-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # TLS 版配置（80 仅 ACME 续期 + 301，443 承载全部流量）
      - ./nginx/default-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt 证书（宿主机 certbot 签发，见 DEPLOY-GUIDE.md）
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ../frontend/student-h5/dist:/app/student:ro
      - ../frontend/teacher-web/dist:/app/teacher:ro
      - ../frontend/parent-h5/dist:/app/parent:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  # P1-2: 每日凌晨 2 点自动 pg_dump 备份（保留 7 天）
  db-backup:
    image: pgvector/pgvector:pg16
    container_name: mindsafe-db-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: mindsafe
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: mindsafe
    volumes:
      - dbbackups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -Fc -f /backups/mindsafe_$(date +%Y%m%d_%H%M%S).dump;
        find /backups -name "*.dump" -mtime +7 -delete;
        sleep 86400;
      done'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:
  redisdata:
  dbbackups:

networks:
  internal:
    driver: bridge
