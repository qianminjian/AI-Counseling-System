# MindSafe 生产部署
# 用法：cp .env.example .env && 编辑 .env && docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindsafe-pg
    # AUD-055：2C2G 主机防 pg 吃满内存
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindsafe
      POSTGRES_USER: mindsafe
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/pg-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # OPS-P0-01（doing/96）：备份卷挂载到 pg 服务——compose 仅创建被服务引用的卷，
      # 顶层声明不被引用时 up 不会创建；挂载后 compose up 必然创建 <project>_dbbackups，
      # 与 backup-common.sh 幂等自愈双保险，杜绝全新部署后每日备份静默失败。
      - dbbackups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindsafe"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: mindsafe-redis
    # AUD-055：2C2G 主机防 redis 内存失控（maxmemory 之外再加容器级兜底）
    mem_limit: 256m
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    # 镜像名与 cd.yml 发布链路对齐：默认本地构建；
    # 用 GHCR 镜像时在 .env 设 BACKEND_IMAGE=ghcr.io/<owner>/<repo>/backend:<sha> 后 docker compose pull
    image: ${BACKEND_IMAGE:-mindsafe/backend:local}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mindsafe-backend
    restart: unless-stopped
    # A-02-01（2026-08-13 遍历）：nginx 为宿主机进程，容器内经 host-gateway 探测宿主 /health
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 宿主端口 18082（切换期：宿主 nginx proxy_pass → 127.0.0.1:18082；healthcheck 仍走容器内 8080）
      # D-01：仅绑定 127.0.0.1（铁律 design/04 §3.1），安全组误开 18082 也无法绕过 nginx 直连
      - "127.0.0.1:18082:8080"
    environment:
      # 激活 prod profile：启用 fail-fast 守卫（JWT/加密密钥缺失拒绝启动）、禁用 Swagger
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mindsafe
      SPRING_DATASOURCE_USERNAME: mindsafe
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # nginx 服务探测（F-30，2026-08-10）：nginx 为宿主机 进程，后端容器内经宿主 IP 探测 /health
      # OPS-008（doing/95）：MINDSAFE_MONITORING_SERVICE_PROBES_NGINX 全仓库无消费者（死 env + 公网 IP 入仓），删除
      # A-02-01（2026-08-13）：恢复探测配置——默认 http://nginx 在无 compose nginx 服务时解析失败误报 DOWN，
      # 改经 host.docker.internal（extra_hosts 已配 host-gateway）探测宿主 nginx；
      # 注意：probeHttp 会拼接 /health，此处 base 不含路径
      MINDSAFE_MONITORING_SERVICE_PROBES_NGINX: http://host.docker.internal
      # LLM 主模型（doing/63：key 主命名；compose 层做新→旧名迁移，yml 回退链覆盖 DEEPSEEK_API_KEY 三级）
      LLM_PRIMARY_API_KEY: ${LLM_PRIMARY_API_KEY:-${LLM_API_KEY:-}}
      LLM_PRIMARY_BASE_URL: ${LLM_PRIMARY_BASE_URL:-${LLM_BASE_URL:-https://api.deepseek.com}}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-${LLM_MODEL:-deepseek-v4-flash}}
      LLM_PRIMARY_TEMPERATURE: ${LLM_PRIMARY_TEMPERATURE:-0.7}
      LLM_PRIMARY_MAX_TOKENS: ${LLM_PRIMARY_MAX_TOKENS:-2048}
      # LLM 备份模型（doing/63：key 备命名；与 TTS/ASR 的 DASHSCOPE_API_KEY 拆分，P2 最小权限设计，2026-08-06）
      LLM_BACKUP_API_KEY: ${LLM_BACKUP_API_KEY:-${LLM_FALLBACK_API_KEY:-}}
      LLM_BACKUP_BASE_URL: ${LLM_BACKUP_BASE_URL:-${LLM_FALLBACK_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}}
      LLM_BACKUP_MODEL: ${LLM_BACKUP_MODEL:-${LLM_FALLBACK_MODEL:-qwen-plus}}
      # Embedding（RAG KB-101 / BUG-LLM-03）：独立变量，yml 回退链不再指向主对话供应商（DeepSeek 无 embeddings 端点）
      # 值暂与 DASHSCOPE_API_KEY 同源（用户后续自行切换供应商时仅改 EMBEDDING_* 三项）
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      # DASHSCOPE_API_KEY 仅 TTS/ASR 消费，backend 容器不再传递（避免 key 复用面过大）
      MINDSAFE_JWT_SECRET: ${JWT_SECRET}
      # 字段加密（doing/64）：ENCRYPTION_ENABLED=false（默认）可不配 key 启动；true 时必须配置合法密钥
      MINDSAFE_ENCRYPTION_ENABLED: ${ENCRYPTION_ENABLED:-false}
      MINDSAFE_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MINDSAFE_ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
      MINDSAFE_ENCRYPTION_PREVIOUS_KEYS: ${ENCRYPTION_PREVIOUS_KEYS:-}
      MINDSAFE_ALERT_WECOM_WEBHOOK_URL: ${ALERT_WECOM_WEBHOOK_URL:-}
      # BA-08：MINDSAFE_ALERT_WECOM_MENTIONED 零消费环境变量已删（WeComAlertService 不再读取）
      # SMS provider（P1 审计修复：未配置 aliyun 凭证时默认 logging，避免 fail-closed 卡部署）
      # 设计修正（2026-08-06）：原设计 M5（fix-13）强制 prod=aliyun，但试点期 SMS 未启用，无凭证；改为 logging
      # 等正式启用短信时再在 .env 设置 SMS_PROVIDER=aliyun 并补齐 MINDSAFE_SMS_ALIYUN_* 凭证。
      MINDSAFE_SMS_PROVIDER: ${SMS_PROVIDER:-logging}
      MINDSAFE_SMS_ALIYUN_ACCESS_KEY_ID: ${SMS_ALIYUN_ACCESS_KEY_ID:-}
      MINDSAFE_SMS_ALIYUN_ACCESS_KEY_SECRET: ${SMS_ALIYUN_ACCESS_KEY_SECRET:-}
      MINDSAFE_SMS_ALIYUN_SIGN_NAME: ${SMS_ALIYUN_SIGN_NAME:-}
      MINDSAFE_SMS_ALIYUN_TEMPLATE_CODE: ${SMS_ALIYUN_TEMPLATE_CODE:-}
      # 监护人同意（AUTH-040）：生产必须 false（走 SMS 真实闭环）
      # DEP-001 修复（2026-08-06）：变量名错配 ${CONSENT_TRIAL_AUTO_GRANT} → ${MINDSAFE_CONSENT_TRIAL_AUTO_GRANT}，与 .env.example 对齐
      MINDSAFE_CONSENT_TRIAL_AUTO_GRANT: ${MINDSAFE_CONSENT_TRIAL_AUTO_GRANT:-false}
      MINDSAFE_CORS_ORIGINS: ${CORS_ORIGINS:-https://yun.gxjugu.com}
      # 企业微信 OAuth（可选，空 = 企微登录返回 501）
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      WECOM_SECRET: ${WECOM_SECRET:-}
      WECOM_REDIRECT_URI: ${WECOM_REDIRECT_URI:-}
      VOICE_SERVICE_URL: http://voice-service:10095
      TTS_SERVICE_URL: http://tts-service:10096
      LOGGING_LEVEL_COM_MINDSAFE: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - internal

  voice-service:
    image: ${VOICE_SERVICE_IMAGE:-mindsafe/voice-service:local}
    build:
      context: ../backend
      dockerfile: voice-service/Dockerfile
    container_name: mindsafe-voice
    restart: unless-stopped
    environment:
      # ASR 引擎：funasr=本地 / dashscope=云端
      ASR_ENGINE: ${ASR_ENGINE:-dashscope}
      # SER 情感分析：true=加载本地 emotion2vec+ / false=禁用
      SER_ENABLED: ${SER_ENABLED:-true}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # D3：Voice 运行时参数透传（与 .env.example 声明、voice-service 消费对齐）
      VOICE_PROCESS_TIMEOUT: ${VOICE_PROCESS_TIMEOUT:-30}
      VOICE_ANALYZE_TIMEOUT: ${VOICE_ANALYZE_TIMEOUT:-60}
      VOICE_CORS_ORIGINS: ${VOICE_CORS_ORIGINS:-}
      # doing/87 RUNTIME-004：覆盖键读取（直连 Redis，fail-open）
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      # 模型缓存：宿主机持久化（emotion2vec ~300MB + SenseVoice ~1GB）
      # 使用前需运行: bash deploy/scripts/prepare-funasr.sh
      # 容器内挂载到非 root 用户 HOME（审计 P3-31：容器不再以 root 运行）
      - ${MODEL_CACHE_DIR:-./cache/modelscope}:/home/appuser/.cache/modelscope
    healthcheck:
      # DA-02：消费 /health status 三态（与 service-manager voice 分支同语义）
      #   UP/DEGRADED=健康（SER 降级 ≠ 宕机）；DOWN=不健康（ASR 核心链路不可用）
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:10095/health', timeout=5)); raise SystemExit(0 if d.get('status') in ('UP','DEGRADED') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    # 内存限额（镜像 Dockerfile 注释：dashscope+SER ~1.5GB / funasr+SER ~4GB，默认 6G 留余量）
    deploy:
      resources:
        limits:
          memory: ${VOICE_MEMORY_LIMIT:-6G}
    networks:
      - internal

  tts-service:
    image: ${TTS_SERVICE_IMAGE:-mindsafe/tts-service:local}
    build:
      context: ../backend
      dockerfile: tts-service/Dockerfile
    container_name: mindsafe-tts
    restart: unless-stopped
    environment:
      # doing/87 RUNTIME-004：覆盖键读取（直连 Redis，fail-open）
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # DC-003：TTS 运行时参数透传（与 .env.example 声明、tts-service 消费对齐）
      DASHSCOPE_TTS_MODEL: ${DASHSCOPE_TTS_MODEL:-cosyvoice-v3-flash}
      TTS_SYNTHESIZE_TIMEOUT: ${TTS_SYNTHESIZE_TIMEOUT:-30}
      TTS_CORS_ORIGINS: ${TTS_CORS_ORIGINS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10096/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - internal

volumes:
  pgdata:
  redisdata:
  # AUD-032/OPS-P0-01（doing/96）：备份卷必须由 compose 显式声明——此前无任何创建方，
  # 全新部署后 backup.sh 探测不到卷 fail-fast，每日 02:00 cron 备份静默失败。
  # compose up 自动创建 <project>_dbbackups 命名卷；backup-common.sh 另有幂等自愈兜底。
  dbbackups:

networks:
  internal:
    name: mindsafe-internal
    driver: bridge
