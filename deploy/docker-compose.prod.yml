# MindSafe 生产部署
# 用法：cp .env.example .env && 编辑 .env && docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindsafe-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindsafe
      POSTGRES_USER: mindsafe
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/pg-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindsafe"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: mindsafe-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    # 镜像名与 cd.yml 发布链路对齐：默认本地构建；
    # 用 GHCR 镜像时在 .env 设 BACKEND_IMAGE=ghcr.io/<owner>/<repo>/backend:<sha> 后 docker compose pull
    image: ${BACKEND_IMAGE:-mindsafe/backend:local}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mindsafe-backend
    restart: unless-stopped
    environment:
      # 激活 prod profile：启用 fail-fast 守卫（JWT/加密密钥缺失拒绝启动）、禁用 Swagger
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mindsafe
      SPRING_DATASOURCE_USERNAME: mindsafe
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      MINDSAFE_JWT_SECRET: ${JWT_SECRET}
      MINDSAFE_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MINDSAFE_ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
      MINDSAFE_ENCRYPTION_PREVIOUS_KEYS: ${ENCRYPTION_PREVIOUS_KEYS:-}
      MINDSAFE_ALERT_WECOM_WEBHOOK_URL: ${ALERT_WECOM_WEBHOOK_URL:-}
      MINDSAFE_ALERT_WECOM_MENTIONED: ${ALERT_WECOM_MENTIONED:-}
      # SMS provider（P1 审计修复：prod profile 禁止默认 logging，未显式配置时 fail-closed 启动失败）
      MINDSAFE_SMS_PROVIDER: ${SMS_PROVIDER:-aliyun}
      MINDSAFE_SMS_ALIYUN_ACCESS_KEY_ID: ${SMS_ALIYUN_ACCESS_KEY_ID:-}
      MINDSAFE_SMS_ALIYUN_ACCESS_KEY_SECRET: ${SMS_ALIYUN_ACCESS_KEY_SECRET:-}
      MINDSAFE_SMS_ALIYUN_SIGN_NAME: ${SMS_ALIYUN_SIGN_NAME:-}
      MINDSAFE_SMS_ALIYUN_TEMPLATE_CODE: ${SMS_ALIYUN_TEMPLATE_CODE:-}
      # 监护人同意（AUTH-040）：生产必须 false（走 SMS 真实闭环）
      MINDSAFE_CONSENT_TRIAL_AUTO_GRANT: ${CONSENT_TRIAL_AUTO_GRANT:-false}
      MINDSAFE_CORS_ORIGINS: ${CORS_ORIGINS:-https://yun.gxjugu.com}
      # 企业微信 OAuth（可选，空 = 企微登录返回 501）
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      WECOM_SECRET: ${WECOM_SECRET:-}
      WECOM_REDIRECT_URI: ${WECOM_REDIRECT_URI:-}
      VOICE_SERVICE_URL: http://voice-service:10095
      TTS_SERVICE_URL: http://tts-service:10096
      LOGGING_LEVEL_COM_MINDSAFE: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - internal

  voice-service:
    image: ${VOICE_SERVICE_IMAGE:-mindsafe/voice-service:local}
    build:
      context: ../backend/voice-service
      dockerfile: Dockerfile
      args:
        ASR_ENGINE: ${ASR_ENGINE:-dashscope}
    container_name: mindsafe-voice
    restart: unless-stopped
    environment:
      # ASR 引擎：funasr=本地 / dashscope=云端
      ASR_ENGINE: ${ASR_ENGINE:-dashscope}
      # SER 情感分析：true=加载本地 emotion2vec+ / false=禁用
      SER_ENABLED: ${SER_ENABLED:-true}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    volumes:
      # 模型缓存：宿主机持久化（emotion2vec ~300MB + SenseVoice ~1GB）
      # 使用前需运行: bash deploy/scripts/prepare-funasr.sh
      - ${MODEL_CACHE_DIR:-./cache/modelscope}:/root/.cache/modelscope
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10095/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    # 内存限额（镜像 Dockerfile 注释：dashscope+SER ~1.5GB / funasr+SER ~4GB，默认 6G 留余量）
    deploy:
      resources:
        limits:
          memory: ${VOICE_MEMORY_LIMIT:-6G}
    networks:
      - internal

  tts-service:
    image: ${TTS_SERVICE_IMAGE:-mindsafe/tts-service:local}
    build:
      context: ../backend/tts-service
      dockerfile: Dockerfile
    container_name: mindsafe-tts
    restart: unless-stopped
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10096/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: mindsafe-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # TLS 版配置（80 仅 ACME 续期 + 301，443 承载全部流量）
      - ./nginx/default-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      # 公共安全头（P1-DEP：default-ssl.conf include 引用，必须挂载到 /etc/nginx/ 下）
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      # Let's Encrypt 证书（宿主机 certbot 签发，见 DEPLOY-GUIDE.md）
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ../frontend/student-h5/dist:/app/student:ro
      - ../frontend/teacher-web/dist:/app/teacher:ro
      - ../frontend/parent-h5/dist:/app/parent:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  # P1-2: 每日凌晨 2 点自动 pg_dump 备份（保留 7 天）
  # 写入 daily/ 子目录：与 backup.sh/restore.sh 的 volume 目录约定一致（restore.sh 只列 daily/weekly/monthly）
  db-backup:
    image: pgvector/pgvector:pg16
    container_name: mindsafe-db-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: mindsafe
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: mindsafe
    volumes:
      - dbbackups:/backups
    entrypoint: >
      sh -c 'mkdir -p /backups/daily && while true; do
        pg_dump -Fc -f /backups/daily/mindsafe_$(date +%Y%m%d_%H%M%S).dump;
        find /backups/daily -name "*.dump" -mtime +7 -delete;
        sleep 86400;
      done'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:
  redisdata:
  dbbackups:

networks:
  internal:
    name: mindsafe-internal
    driver: bridge
