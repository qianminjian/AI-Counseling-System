# MindSafe 生产 nginx 配置（TLS 版，仅 docker-compose.prod.yml 挂载）
# 前置条件：宿主机已用 certbot 签发证书（见 DEPLOY-GUIDE.md「HTTPS 证书」节）
# 域名变更时替换所有 yun.gxjugu.com 与证书路径

# HTTP：仅保留 ACME 续期挑战，其余全部 301 到 HTTPS
server {
    listen 80;
    server_name yun.gxjugu.com;

    # certbot webroot 续期挑战
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name yun.gxjugu.com;

    # 与后端 spring.servlet.multipart.max-request-size=12MB 对齐
    client_max_body_size 12m;

    ssl_certificate     /etc/letsencrypt/live/yun.gxjugu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yun.gxjugu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS（等保二级：通信传输加密）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 学生端 H5（默认站点）
    location / {
        root /app/student;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 教师端（/teacher 路径）
    location /teacher {
        alias /app/teacher;
        index index.html;
        try_files $uri $uri/ /teacher/index.html;
    }

    # 数据大屏（/bigscreen）
    location /bigscreen {
        alias /app/teacher;
        try_files $uri /teacher/index.html;
    }

    # 家长端 H5（/parent）
    location /parent {
        alias /app/parent;
        index index.html;
        try_files $uri $uri/ /parent/index.html;
    }

    # API 代理（含 SSE 流式支持：AI 对话流式回复）
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式支持：关闭缓冲使 token 实时下发，HTTP/1.1 + 空 Connection 保持长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # WebSocket 代理（前端按页面协议自动升级为 wss://）
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
    }

    # Actuator 健康检查（内部）
    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;
}
