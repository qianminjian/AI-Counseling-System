# MindSafe 公共安全响应头（P1-DEP：修复 add_header 继承缺陷 + 双配置漂移）
#
# 背景：nginx add_header 一旦在嵌套 location 中出现（如 sw.js 的 Cache-Control），
#       server 级全部安全头对那个 location 就不再继承 —— 此前 /models/ /ort/ 等
#       静态资源响应缺失 CSP/X-Frame-Options 等头（P1-DEP 漂移审计发现）。
# 方案：安全头收敛到本文件，server 级 + 所有含 add_header 的嵌套 location 统一 include，
#       保证任何路径的响应都带全量安全头。
#
# wasm-unsafe-eval：学生端 ONNX Runtime WASM 编译必需（P1-FE-1）
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;

# Cross-Origin Isolation：启用 SharedArrayBuffer（ONNX Runtime WASM 多线程必需）
# 缺少此头 → iOS Safari 无 SharedArrayBuffer → ORT WASM 工厂顶层语句崩溃 → 模型"100%后加载失败"
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
