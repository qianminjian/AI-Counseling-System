server {
    listen 80;
    server_name _;

    # 与后端 spring.servlet.multipart.max-request-size=12MB 对齐
    client_max_body_size 12m;

    # P1-1: CSP 安全头（生产环境无 inline script/style，Vite 构建产物均为外部文件）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;

    # Cross-Origin Isolation：启用 SharedArrayBuffer（ONNX Runtime WASM 多线程必需）
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # 学生端 H5（/mindsafe 路径，与 Vite base 对齐）
    # ^~ 防止下方 \.(js|css)$ 正则 location 抢走静态资源请求（正则 location 无 root 会 404）
    location ^~ /mindsafe {
        alias /app/student;
        index index.html;
        try_files $uri $uri/ /mindsafe/index.html;

        # PWA 入口文件：禁止缓存，确保浏览器每次检查 SW 更新
        location = /mindsafe/sw.js {
            alias /app/student/sw.js;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
        location = /mindsafe/index.html {
            alias /app/student/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location = /mindsafe/manifest.webmanifest {
            alias /app/student/manifest.webmanifest;
            add_header Cache-Control "no-cache";
        }

        # 端侧 ONNX 模型 + ORT WASM（大体积二进制，1年强缓存 + immutable）；
        # 嵌套在 /mindsafe 前缀内，用显式 alias 避免正则 location 无 root 导致 404
        location /mindsafe/models/ {
            alias /app/student/models/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            # WASM 需要正确的 MIME 类型
            types {
                application/wasm wasm;
                application/javascript mjs;
                application/json json;
                application/octet-stream onnx;
            }
        }
        location /mindsafe/ort/ {
            alias /app/student/ort/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            types {
                application/wasm wasm;
                application/javascript mjs;
            }
        }
    }

    # 根路径重定向到学生端
    location = / {
        return 302 /mindsafe/;
    }

    # 教师端（/teacher 路径）
    location ^~ /teacher {
        alias /app/teacher;
        index index.html;
        try_files $uri $uri/ /teacher/index.html;
    }

    # 数据大屏（/bigscreen）
    location ^~ /bigscreen {
        alias /app/teacher;
        try_files $uri /teacher/index.html;
    }

    # 家长端 H5（/parent）
    location ^~ /parent {
        alias /app/parent;
        index index.html;
        try_files $uri $uri/ /parent/index.html;
    }

    # API 代理（含 SSE 流式支持：AI 对话流式回复）
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式支持：关闭缓冲使 token 实时下发，HTTP/1.1 + 空 Connection 保持长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # WebSocket 代理
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Actuator 防护：只对外暴露 health（容器健康检查用）；
    # metrics/prometheus 由监控栈直连 backend:8080 抓取，不经 nginx
    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }
    location /actuator/ {
        return 404;
    }

    # 静态资源缓存（Vite 构建产物带 hash，可安全 immutable）
    # 注：前端路径均已被上方 ^~ 前缀 location 接管，本正则仅服务根级资源
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;
}
