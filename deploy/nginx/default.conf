server {
    listen 80;
    server_name _;

    # 学生端 H5（默认站点）
    location / {
        root /app/student;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 教师端（/teacher 路径）
    location /teacher {
        alias /app/teacher;
        index index.html;
        try_files $uri $uri/ /teacher/index.html;
    }

    # 数据大屏（/bigscreen）
    location /bigscreen {
        alias /app/teacher;
        try_files $uri /teacher/index.html;
    }

    # 家长端 H5（/parent）
    location /parent {
        alias /app/parent;
        index index.html;
        try_files $uri $uri/ /parent/index.html;
    }

    # API 代理（含 SSE 流式支持：AI 对话流式回复）
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式支持：关闭缓冲使 token 实时下发，HTTP/1.1 + 空 Connection 保持长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # WebSocket 代理
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Actuator 健康检查（内部）
    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;
}
