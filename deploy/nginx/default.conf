server {
    listen 80;
    server_name _;

    # 与后端 spring.servlet.multipart.max-request-size=12MB 对齐
    client_max_body_size 12m;

    # P1-1: CSP 安全头（生产环境无 inline script/style，Vite 构建产物均为外部文件）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # 学生端 H5（默认站点）
    location / {
        root /app/student;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 教师端（/teacher 路径）
    location /teacher {
        alias /app/teacher;
        index index.html;
        try_files $uri $uri/ /teacher/index.html;
    }

    # 数据大屏（/bigscreen）
    location /bigscreen {
        alias /app/teacher;
        try_files $uri /teacher/index.html;
    }

    # 家长端 H5（/parent）
    location /parent {
        alias /app/parent;
        index index.html;
        try_files $uri $uri/ /parent/index.html;
    }

    # API 代理（含 SSE 流式支持：AI 对话流式回复）
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式支持：关闭缓冲使 token 实时下发，HTTP/1.1 + 空 Connection 保持长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # WebSocket 代理
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Actuator 健康检查（内部）
    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
    }

    # 语音模型 + ONNX WASM（大体积二进制，1年强缓存 + immutable 消除条件请求）
    location ~* ^/(models|ort)/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 模型文件不需要 CSP 头（非 HTML/JS 资源）
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 静态资源缓存（Vite 构建产物带 hash，可安全 immutable）
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;
}
