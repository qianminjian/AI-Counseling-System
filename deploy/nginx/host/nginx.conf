user root;
worker_processes  1;

events {
    worker_connections  1024;
}

http {

    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    gzip  on;  
    #低于1kb的资源不压缩 
    gzip_min_length 1k;
    #压缩级别1-9，越大压缩率越高，同时消耗cpu资源也越多，建议设置在5左右。 
    gzip_comp_level 5; 
    #需要压缩哪些响应类型的资源，多个空格隔开。不建议压缩图片.
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/xml text/css; 
    #配置禁用gzip条件，支持正则。此处表示ie6及以下不启用gzip（因为ie低版本不支持）
    gzip_disable "MSIE [1-6]\.";  
    #是否添加“Vary: Accept-Encoding”响应头
    gzip_vary on;
    #开启gzip静态压缩功能,开启nginx_static后，对于任何文件都会先查找是否有对应的gz文件
    # gzip_static on;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    # AUD-030/OPS-P1-01（doing/96）：生产宿主 nginx 补认证端点限流（此前仅 test/dev 的
    # default.conf 有 limit_req，生产宿主 902 行 0 命中——安全门禁实际未生效）。
    # 10r/s + 突发 20，zone 10m 约存 16 万 IP；应用层已有 chat 拦截，此为网关注入层。
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    # MaxKb 
	upstream maxkb {
        server localhost:8080;
    }
    # fpr代理
    upstream proxy {
        server localhost:8091;
    }

    # nacos
    upstream nacos {
        server localhost:9090;
    }

    # 容器内服务探测专用（F-30，2026-08-10）：后端容器经宿主公网 IP 访问 /health，
    # 避免 Host=IP 命中默认 server 产生 502；其余请求 444 拒绝
    server {
        listen 80;
        server_name 116.8.109.229;
        location = /health {
            default_type application/json;
            return 200 '{"status":"UP"}';
        }
        location / {
            return 444;
        }
    }

    server {
        listen 80;
        server_name proxy.gxjugu.com;

        location / {
            proxy_pass http://proxy;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header   X-Real-IP $remote_addr;
        }

    }
server {
        listen 443;
        server_name k3s.gxjugu.com;

        client_max_body_size 0;


        ssl_certificate /guju/k3s/ssl/tls.crt;
        ssl_certificate_key /guju/k3s/ssl/tls.key;

        ssl_verify_client off;


        location / {
                proxy_pass http://172.16.1.124:6443;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Port $server_port;

                # WebSocket 支持
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";

            }

    }


 server {
        listen 80;
        server_name kuboard.gxjugu.com;
        return 301 https://$server_name$request_uri;
    }
 server {
        listen 443;
        server_name kuboard.gxjugu.com;

        client_max_body_size 0;


        ssl_certificate /guju/k3s/ssl/tls.crt;
        ssl_certificate_key /guju/k3s/ssl/tls.key;

        ssl_verify_client off;

        location / {
		proxy_pass http://172.16.1.124:31080;
	        gzip on;
        }

	location /k8s-ws/ {
	    proxy_pass  http://172.16.1.124:31080/k8s-ws/;  # 替换成你的节点地址
	    proxy_http_version 1.1;
	    proxy_pass_header Authorization;
	    proxy_set_header Upgrade "websocket";
	    proxy_set_header Connection "upgrade";
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme; # 如果您在反向代理上启用了 HTTPS
	  }
	location /k8s-proxy/ {
	      proxy_pass  http://172.16.1.124:31080/k8s-proxy/;  # 替换成你的 Kuboard IP 地址和端口
	      proxy_http_version 1.1;
	      proxy_pass_header Authorization;
	      proxy_set_header Upgrade $http_upgrade;
	      proxy_set_header Connection "upgrade";
	
	      proxy_set_header Host $host;
	      proxy_set_header X-Real-IP $remote_addr;
	      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	      # proxy_set_header X-Forwarded-Proto $scheme; # 如果您在反向代理上启用了 HTTPS
	      gzip on;
	    }

    }

