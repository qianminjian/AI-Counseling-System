        #电子证照
        server {
            listen       8860;
            server_name  localhost;
            underscores_in_headers on;
            client_max_body_size       1000m;

            location / {

                      proxy_http_version 1.1;
                      proxy_redirect off;
                      proxy_set_header Host $host:$server_port;
                      proxy_set_header X-Real-Ip $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                      add_header 'Access-Control-Allow-Origin' *;
                      add_header 'Access-Control-Allow-Credentials' 'true';
                      add_header 'Access-Control-Allow-Methods' *;
                      add_header 'Access-Control-Allow-Headers' 'authorization,Authorization,DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,x-token,userinfo,accessToken,accessTokenPrintVueClient';

                    alias  /workspace/test/dist/;
                    index index.html;
                    try_files $uri $uri/ /index.html;

                      proxy_connect_timeout 1800s;
                      proxy_send_timeout 1800s;
                      proxy_read_timeout 1800s;
            }

                location /elelicenseapi {
                        proxy_http_version 1.1;       
                        proxy_redirect off;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-Ip $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                        rewrite  ^/elelicenseapi/(.*)$ /$1 break;
                        proxy_pass http://localhost:8862;
                }


        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }
    }

