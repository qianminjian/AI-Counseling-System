    server {
        listen 80;
        server_name yun.gxjugu.com maxkb.gxjugu.com; 

        # ACME HTTP-01 validation webroot (do NOT redirect to HTTPS)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }
    
	# maxkb
    server {
        listen       443 ssl ;
        server_name  maxkb.gxjugu.com;

        ssl_certificate /etc/nginx/ssl/maxkb.gxjugu.com.pem;
        ssl_certificate_key /etc/nginx/ssl/maxkb.gxjugu.com.key;

        location / {
            proxy_pass http://maxkb;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        
        
        location /EXreQWNgkI.txt {
            root    /guju/app;
            try_files $uri $uri/ /index.html;
            index   index.html;
        }
    }
	
    # nacos
    server {

        listen       443 ssl ;
        server_name  nacos.gxjugu.com;

        ssl_certificate /etc/nginx/ssl/nacos.gxjugu.com.pem;
        ssl_certificate_key /etc/nginx/ssl/nacos.gxjugu.com.key;

        location / {
            proxy_pass http://nacos;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }

    server {
        # HTTP/2（2026-08-09）：模型大文件多路复用加速（30M 唤醒模型首次下载）
        listen       443 ssl;
        http2 on;
        server_name  yun.gxjugu.com;
        
        ssl_certificate /etc/nginx/ssl/yun.gxjugu.com.pem;
        ssl_certificate_key /etc/nginx/ssl/yun.gxjugu.com.key;

        ssl_session_timeout 5m;
        client_max_body_size 50m;
        # Cross-Origin Isolation: enable SharedArrayBuffer (required by ONNX Runtime WASM)
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # doing/90 P3-1（2026-08-11）：安全头部——防 MIME 嗅探/点击劫持/HSTS
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        #ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
        #ssl_protocols TLSv1 TLSv1.1 TLSv1.2; #表示使用的TLS协议的类型。
        #ssl_prefer_server_ciphers on;

        location @router {
           rewrite ^.*$ /index.html last;
        }

        # MindSafe AI 心理辅导系统
        # OPS-P1-01（doing/96）：敏感认证前缀限流（与 default.conf AUD-030 同策略：
        # 声纹/家长认证/登录 10r/s+burst20；注意 prefix 匹配最长优先，细粒度块先命中）
        location /api/v1/voiceprint/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://127.0.0.1:18082/api/v1/voiceprint/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
        }

        location /api/v1/parent/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://127.0.0.1:18082/api/v1/parent/auth/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
        }

        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://127.0.0.1:18082/api/v1/auth/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:18082/api/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            # SSE streaming support (AI chat streaming reply)
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:18082/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # MindSafe 模型+ORT WASM 强缓存
        # BUG-NGINX-01：root 指向旧 student 目录（双部署架构残留）→ /mindsafe/models/* 404（rewrite 后拼 student/models）
        # 改为 student-h5/dist（rewrite break 后 /models/... 拼 dist/models/...）
        # OPS-005（doing/95）：宿主层补 CSP（与容器 security-headers.conf 同策略，wasm-unsafe-eval 为 ORT 必需）
        location ~* ^/mindsafe/(models|ort)/ {
            root /guju/mindsafe/frontend/student-h5/dist;
            rewrite ^/mindsafe/(.*)$ /$1 break;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
        }

        # SW + HTML no-cache (PWA update)
        location = /mindsafe/sw.js {
            alias /guju/mindsafe/frontend/student-h5/dist/sw.js;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
        }
        location = /mindsafe/index.html {
            alias /guju/mindsafe/frontend/student-h5/dist/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
        }
        # 静态资源（assets/ort/models/fonts）不存在时直接 404，不做 SPA fallback
        # 防止旧 SW 缓存的过期 JS hash 被 fallback 为 HTML 导致 MIME 错误
        # OPS-005（doing/95）：宿主层补 CSP
        location ~* ^/mindsafe/(assets|ort|models|fonts)/(.*)$ {
            alias /guju/mindsafe/frontend/student-h5/dist/$1/$2;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
        }

        location /mindsafe/ {
            alias /guju/mindsafe/frontend/student-h5/dist/;
            try_files $uri $uri/ /mindsafe/index.html;
            index index.html;
            # OPS-005（doing/95）：宿主层补 CSP（SPA 主入口与普通静态）
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        location /admin/ {
            alias /guju/mindsafe/frontend/admin-web/dist/;
            try_files $uri $uri/ /admin/index.html;
            index index.html;
            # OPS-005（doing/95）：宿主层补 CSP（管理端 SPA）
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        location /teacher/ {
            alias /guju/mindsafe/frontend/teacher-web/dist/;
            try_files $uri $uri/ /teacher/index.html;
            index index.html;
            # OPS-005（doing/95）：宿主层补 CSP（教师端 SPA）
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        # 数据大屏（教师端 SPA 独立顶级路由，需已登录）
        location ^~ /bigscreen {
            alias /guju/mindsafe/frontend/teacher-web/dist/;
            try_files $uri /teacher/index.html;
            # OPS-005（doing/95）：宿主层补 CSP（数据大屏）
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }


        location /parent/ {
            alias /guju/mindsafe/frontend/parent-h5/dist/;
            try_files $uri $uri/ /parent/index.html;
            index index.html;
            # OPS-005（doing/95）：宿主层补 CSP（家长端 SPA）
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }
        # === AiDesign 施工图 AI 平台 ===
        location /aidesign/api/bff/ {
            proxy_pass http://127.0.0.1:18060/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
