# MindSafe 测试/演示环境（轻量版）
# 适用于阿里云 ECS 经济型 e 实例 (2C2G/2C4G x86_64)
# 不含 voice-service / tts-service（节省内存）
# 用法：cp .env.example .env && 编辑 .env && docker compose -f docker-compose.test.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindsafe-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindsafe
      POSTGRES_USER: mindsafe
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindsafe"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: mindsafe-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    image: ghcr.io/${GITHUB_OWNER:-mindsafe}/mindsafe-backend:latest
    container_name: mindsafe-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mindsafe
      SPRING_DATASOURCE_USERNAME: mindsafe
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LOGGING_LEVEL_COM_MINDSAFE: DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: mindsafe-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - student-dist:/usr/share/nginx/html/student:ro
      - teacher-dist:/usr/share/nginx/html/teacher:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  # 前端静态文件容器（CI 构建后 copy 到 volume）
  frontend-init:
    image: ghcr.io/${GITHUB_OWNER:-mindsafe}/mindsafe-frontend:latest
    container_name: mindsafe-frontend-init
    volumes:
      - student-dist:/export/student
      - teacher-dist:/export/teacher
    entrypoint: /bin/sh
    command: ["-c", "cp -r /app/student/* /export/student/ && cp -r /app/teacher/* /export/teacher/ && echo 'Frontend assets copied'"]
    restart: "no"

volumes:
  pgdata:
  redisdata:
  student-dist:
  teacher-dist:

networks:
  internal:
    driver: bridge
