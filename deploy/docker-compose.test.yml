# MindSafe 测试/演示环境（轻量版）
# 适用于阿里云 ECS 经济型 e 实例 (2C2G/2C4G x86_64)
# 不含 voice-service / tts-service（节省内存）
# 用法：cp .env.example .env && 编辑 .env && docker compose -f docker-compose.test.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindsafe-pg
    # AUD-055：2C2G 主机防 pg 吃满内存
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindsafe
      POSTGRES_USER: mindsafe
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindsafe"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: mindsafe-redis
    # AUD-055：2C2G 主机防 redis 内存失控（maxmemory 之外再加容器级兜底）
    mem_limit: 256m
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    image: ghcr.io/${GITHUB_OWNER:-mindsafe}/${GITHUB_REPOSITORY:-AI-Counseling-System-dev}/backend:latest
    container_name: mindsafe-backend
    restart: unless-stopped
    environment:
      # 测试环境使用 dev profile：允许 JWT/加密密钥开发默认值（非 fail-fast）
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mindsafe
      SPRING_DATASOURCE_USERNAME: mindsafe
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT 认证（.env 可配；不配则用 dev 默认密钥）
      MINDSAFE_JWT_SECRET: ${JWT_SECRET:-}
      # 字段加密（flx-deploy：与 prod.yml 对齐；空=dev 降级明文）
      MINDSAFE_ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      MINDSAFE_ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
      MINDSAFE_ENCRYPTION_PREVIOUS_KEYS: ${ENCRYPTION_PREVIOUS_KEYS:-}
      # LLM 主模型（doing/63：key 主命名；旧名 LLM_* 由 compose 层迁移，测试环境独立模型值 deepseek-chat 属有意差异）
      LLM_PRIMARY_API_KEY: ${LLM_PRIMARY_API_KEY:-${LLM_API_KEY:-}}
      LLM_PRIMARY_BASE_URL: ${LLM_PRIMARY_BASE_URL:-${LLM_BASE_URL:-https://api.deepseek.com}}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-${LLM_MODEL:-deepseek-chat}}
      LLM_PRIMARY_TEMPERATURE: ${LLM_PRIMARY_TEMPERATURE:-0.7}
      LLM_PRIMARY_MAX_TOKENS: ${LLM_PRIMARY_MAX_TOKENS:-2048}
      # LLM 备份模型（可选：为空 = 单模型模式）
      LLM_BACKUP_API_KEY: ${LLM_BACKUP_API_KEY:-${LLM_FALLBACK_API_KEY:-}}
      LLM_BACKUP_BASE_URL: ${LLM_BACKUP_BASE_URL:-${LLM_FALLBACK_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}}
      LLM_BACKUP_MODEL: ${LLM_BACKUP_MODEL:-${LLM_FALLBACK_MODEL:-qwen-plus}}
      # 短信（测试用 logging，不消费短信额度）
      MINDSAFE_SMS_PROVIDER: ${SMS_PROVIDER:-logging}
      MINDSAFE_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      LOGGING_LEVEL_COM_MINDSAFE: DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: mindsafe-nginx
    # AUD-055：静态代理容器内存占用极低，限 128m 防异常增长
    mem_limit: 128m
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 挂载路径必须与 default.conf 的 alias 一致（/app/student、/app/teacher、/app/parent）；
      # 挂到 /usr/share/nginx/html/* 会导致全部前端 404
      - student-dist:/app/student:ro
      - teacher-dist:/app/teacher:ro
      - parent-dist:/app/parent:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend-init:
        condition: service_completed_successfully
    networks:
      - internal

  # 前端静态文件容器（CI 构建后 copy 到 volume）
  frontend-init:
    image: ghcr.io/${GITHUB_OWNER:-mindsafe}/${GITHUB_REPOSITORY:-AI-Counseling-System-dev}/frontend:latest
    container_name: mindsafe-frontend-init
    volumes:
      - student-dist:/export/student
      - teacher-dist:/export/teacher
      - parent-dist:/export/parent
    entrypoint: /bin/sh
    command: ["-c", "cp -r /app/student/* /export/student/ && cp -r /app/teacher/* /export/teacher/ && cp -r /app/parent/* /export/parent/ && echo 'Frontend assets copied'"]
    restart: "no"

volumes:
  pgdata:
  redisdata:
  student-dist:
  teacher-dist:
  parent-dist:

networks:
  internal:
    name: mindsafe-internal
    driver: bridge
