<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0EA5E9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="波波小精灵" />
    <link rel="apple-touch-icon" href="/mindsafe/pwa-192.png" />
    <title>波波小精灵</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // SW 缓存清理：在模块加载前执行，确保新代码不被旧 SW 拦截
      (function(){
        var K='__sw_cleaned_v2';
        if('serviceWorker' in navigator && !sessionStorage.getItem(K)){
          navigator.serviceWorker.getRegistrations().then(function(r){
            if(r.length>0){
              Promise.all(r.map(function(s){return s.unregister()})).then(function(){
                if('caches' in window) caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})});
                sessionStorage.setItem(K,'1');
                location.reload();
              });
            } else { sessionStorage.setItem(K,'1'); }
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
